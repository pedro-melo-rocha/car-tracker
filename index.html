<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6F5F1;
  --bg-warm: #EDECEA;
  --bg-card: #FFFFFF;
  --bg-overlay: rgba(30,28,24,0.4);
  --text: #1E1C18;
  --text-secondary: #6B6760;
  --text-muted: #A09B93;
  --accent: #0C6E5D;
  --accent-light: #E8F5F1;
  --accent-soft: #F0F8F5;
  --accent-hover: #0A5C4E;
  --green: #2D8B6F;
  --green-bg: #E8F5F1;
  --yellow: #C4930A;
  --yellow-bg: #FFF8E1;
  --red: #C0503A;
  --red-bg: #FDEEEA;
  --blue: #3B7DD8;
  --blue-bg: #EBF2FC;
  --border: rgba(0,0,0,0.06);
  --border-strong: rgba(0,0,0,0.1);
  --shadow-sm: 0 1px 2px rgba(16,14,10,0.04);
  --shadow: 0 4px 14px -4px rgba(16,14,10,0.08);
  --shadow-lg: 0 18px 48px -12px rgba(16,14,10,0.14);
  --shadow-xl: 0 24px 70px -14px rgba(16,14,10,0.2);
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-fast: 120ms;
  --dur: 200ms;
  --fs-xs: 0.72rem;
  --fs-sm: 0.82rem;
  --fs-md: 0.92rem;
  --fs-lg: 1.05rem;
  --font: 'Plus Jakarta Sans', -apple-system, sans-serif;
  --mono: 'DM Mono', 'SF Mono', monospace;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
    scroll-behavior: auto !important;
  }
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
button { cursor: pointer; font-family: inherit; }
input, select, textarea { font-family: inherit; }

/* Animations */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes slideIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes slideInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes slideInDown {
  from { opacity: 0; transform: translateY(-12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes slideOutRight {
  to { opacity: 0; transform: translateX(20px); }
}
@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.97); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes shimmer {
  0% { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes sheetUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

/* Header */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(246,245,241,0.85);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  display: flex; align-items: center; gap: 32px;
  height: 64px;
}
.header h1 {
  font-size: 1.05rem; font-weight: 800; letter-spacing: -0.03em;
  color: var(--text); white-space: nowrap;
}
.header h1 span { color: var(--accent); }
.nav-tabs { display: flex; gap: 2px; background: var(--bg-warm); border-radius: 10px; padding: 3px; }
.nav-tab {
  background: transparent; border: none;
  color: var(--text-muted); padding: 7px 18px;
  border-radius: 8px; font-size: 0.82rem; font-weight: 600;
  transition: all 0.2s ease; letter-spacing: -0.01em;
}
.nav-tab:hover { color: var(--text-secondary); }
.nav-tab.active { background: var(--bg-card); color: var(--text); box-shadow: var(--shadow-sm); }
.header-right { margin-left: auto; }
.btn-add {
  background: var(--accent); border: none; color: #fff;
  padding: 0 16px; height: 36px; border-radius: 10px;
  font-size: 0.84rem; font-weight: 700; letter-spacing: -0.01em;
  display: inline-flex; align-items: center; gap: 6px;
  transition: all 0.2s ease; box-shadow: 0 2px 8px rgba(12,110,93,0.25);
  white-space: nowrap;
}
.btn-add:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(12,110,93,0.3); }

/* Filter bar */
.filter-bar {
  padding: 14px 32px; display: flex; flex-wrap: wrap; gap: 8px;
  align-items: center; background: var(--bg);
}
.filter-bar input[type="text"] {
  background: var(--bg-card); border: 1px solid var(--border-strong);
  color: var(--text); padding: 8px 14px; border-radius: var(--radius-sm);
  font-size: 0.82rem; min-width: 220px; outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.filter-bar input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(12,110,93,0.08); }
.filter-bar input[type="text"]::placeholder { color: var(--text-muted); }
.filter-bar select {
  background: var(--bg-card); border: 1px solid var(--border-strong);
  color: var(--text-secondary); padding: 8px 12px; border-radius: var(--radius-sm);
  font-size: 0.82rem; outline: none; cursor: pointer;
  transition: border-color 0.2s;
}
.filter-bar select:focus { border-color: var(--accent); }
.sort-btn {
  background: var(--bg-card); border: 1px solid var(--border-strong);
  color: var(--text-muted); padding: 6px 12px; border-radius: var(--radius-sm);
  font-size: 0.78rem; font-weight: 600; transition: all 0.2s;
  letter-spacing: -0.01em;
}
.sort-btn:hover { border-color: var(--accent); color: var(--accent); }
.sort-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.fuel-toggle { display: flex; gap: 0; }
.fuel-toggle button {
  background: var(--bg-card); border: 1px solid var(--border-strong);
  color: var(--text-muted); padding: 6px 14px; font-size: 0.78rem; font-weight: 600;
  transition: all 0.15s;
}
.fuel-toggle button:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
.fuel-toggle button:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.fuel-toggle button:not(:first-child) { border-left: none; }
.fuel-toggle button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* List view: top-bar extras */
.list-count {
  margin-left: auto; color: var(--text-muted); font-size: 0.78rem;
  font-weight: 600; letter-spacing: 0.02em; white-space: nowrap;
}
.list-filters-btn {
  display: none; align-items: center; gap: 6px;
  background: var(--bg-card); border: 1px solid var(--border-strong);
  color: var(--text-secondary); padding: 6px 12px; border-radius: var(--radius-sm);
  font-size: 0.78rem; font-weight: 600; transition: all 0.15s;
}
.list-filters-btn:hover { border-color: var(--accent); color: var(--accent); }
.list-filters-btn svg { width: 14px; height: 14px; }
.filter-count-pill {
  background: var(--accent); color: #fff; font-size: 0.68rem;
  font-weight: 700; padding: 1px 6px; border-radius: 999px; min-width: 16px;
  text-align: center; line-height: 1.4;
}
.list-clear-btn {
  background: transparent; border: 1px solid transparent; color: var(--text-muted);
  padding: 6px 10px; border-radius: var(--radius-sm);
  font-size: 0.76rem; font-weight: 600; transition: all 0.15s;
}
.list-clear-btn:hover { color: var(--red); border-color: var(--red); }

/* List table: filter icon inside headers */
.list-table th .th-inner {
  display: inline-flex; align-items: center; gap: 4px;
}
.list-table th .th-label {
  background: transparent; border: none; padding: 0; margin: 0;
  color: inherit; font: inherit; letter-spacing: inherit;
  text-transform: inherit; cursor: pointer;
}
.list-table th .th-label:hover { color: var(--accent); }
.list-table th .th-label.active { color: var(--accent); }
.list-table th .th-filter {
  background: transparent; border: none; padding: 2px 4px; margin: 0;
  color: var(--text-muted); cursor: pointer; line-height: 1;
  border-radius: 4px; display: inline-flex; align-items: center;
  transition: background 0.15s, color 0.15s;
}
.list-table th .th-filter svg { width: 11px; height: 11px; }
.list-table th .th-filter:hover { background: var(--bg); color: var(--accent); }
.list-table th .th-filter.active {
  color: var(--accent); background: var(--accent-light, rgba(12,110,93,0.12));
}

/* Column filter popover (desktop) + mobile sheet */
.th-popover {
  position: fixed; z-index: 320; display: none;
  flex-direction: column;
  background: var(--bg-card); border: 1px solid var(--border-strong);
  border-radius: var(--radius); box-shadow: var(--shadow-xl, 0 10px 40px rgba(0,0,0,0.18));
  padding: 12px; min-width: 220px; max-width: 280px;
  max-height: min(60vh, 420px);
  font-size: 0.84rem; color: var(--text);
}
.th-popover.open { display: flex; animation: scaleIn 0.15s ease; }
.th-popover .pop-title {
  font-size: 0.7rem; font-weight: 700; color: var(--text-muted);
  letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px;
  flex: 0 0 auto;
}
.th-popover .pop-options {
  display: flex; flex-direction: column; gap: 2px;
  overflow-y: auto; min-height: 0; flex: 1 1 auto;
  padding-right: 4px;
}
.th-popover .pop-options::-webkit-scrollbar { width: 4px; }
.th-popover .pop-options::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }
.th-popover label.pop-option {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: var(--radius-sm); cursor: pointer;
  transition: background 0.1s;
}
.th-popover label.pop-option:hover { background: var(--bg-warm); }
.th-popover label.pop-option input { margin: 0; accent-color: var(--accent); }
.th-popover label.pop-option .pop-opt-label { flex: 1; }
.th-popover .pop-range {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 2px;
}
.th-popover .pop-range input {
  background: var(--bg); border: 1px solid var(--border-strong);
  color: var(--text); padding: 6px 8px; border-radius: var(--radius-sm);
  font-size: 0.82rem; outline: none; width: 100%;
  font-family: var(--mono);
}
.th-popover .pop-range input:focus { border-color: var(--accent); }
.th-popover .pop-range-labels {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  color: var(--text-muted); font-size: 0.7rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 2px;
}
.th-popover .pop-actions {
  display: flex; justify-content: space-between; gap: 8px;
  margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
  flex: 0 0 auto;
}
.th-popover .pop-actions button {
  background: transparent; border: 1px solid var(--border-strong);
  color: var(--text-secondary); padding: 5px 10px; border-radius: var(--radius-sm);
  font-size: 0.76rem; font-weight: 600; transition: all 0.15s;
}
.th-popover .pop-actions button.pop-clear:hover { border-color: var(--red); color: var(--red); }
.th-popover .pop-actions button.pop-close { background: var(--accent); border-color: var(--accent); color: #fff; }
.th-popover .pop-actions button.pop-close:hover { background: var(--accent-hover); }

/* Mobile filter sheet sections (reuses .modal-overlay / .modal shell) */
.mf-section { margin-bottom: 18px; }
.mf-section:last-child { margin-bottom: 0; }
.mf-title {
  font-size: 0.72rem; font-weight: 700; color: var(--text-muted);
  letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px;
}
.mf-options { display: flex; flex-direction: column; gap: 2px; }

/* Pipeline */
.pipeline {
  display: flex; gap: 14px; padding: 20px 32px;
  overflow-x: auto; min-height: calc(100vh - 140px); align-items: flex-start;
}
.pipeline::-webkit-scrollbar { height: 6px; }
.pipeline::-webkit-scrollbar-track { background: transparent; }
.pipeline::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
.pipeline-col {
  background: var(--bg-warm); border-radius: var(--radius-lg);
  min-width: 270px; max-width: 310px; flex: 1;
  animation: fadeUp 0.4s ease both;
}
.pipeline-col:nth-child(2) { animation-delay: 0.04s; }
.pipeline-col:nth-child(3) { animation-delay: 0.08s; }
.pipeline-col:nth-child(4) { animation-delay: 0.12s; }
.pipeline-col:nth-child(5) { animation-delay: 0.16s; }
.pipeline-col:nth-child(6) { animation-delay: 0.20s; }
.pipeline-col:nth-child(7) { animation-delay: 0.24s; }
.pipeline-col-header {
  padding: 14px 16px 10px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 0.78rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--text-secondary);
}
.count-badge {
  background: var(--bg-card); color: var(--text-muted);
  padding: 2px 9px; border-radius: 20px; font-size: 0.72rem;
  font-weight: 600; font-family: var(--mono);
  box-shadow: var(--shadow-sm);
}
.pipeline-col-body {
  padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 8px;
  max-height: calc(100vh - 220px); overflow-y: auto;
}
.pipeline-col-body::-webkit-scrollbar { width: 4px; }
.pipeline-col-body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

/* Cards */
.car-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
  cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease),
              box-shadow var(--dur-fast) var(--ease),
              transform var(--dur-fast) var(--ease),
              opacity var(--dur-fast) var(--ease);
  box-shadow: var(--shadow-sm);
  animation: fadeUp 0.3s var(--ease) both;
}
.car-card:hover {
  box-shadow: var(--shadow);
  border-color: var(--border-strong);
  transform: translateY(-1px);
}
.car-card:active { transform: translateY(0) scale(0.995); }
.car-card { position: relative; }
.car-card.is-pending,
.list-card.is-pending { opacity: 0.65; pointer-events: none; }
tr.is-pending td { opacity: 0.65; }
.car-card.is-pending::after,
.list-card.is-pending::after {
  content: 'Saving\u2026';
  position: absolute; top: 8px; right: 10px;
  font-size: 0.66rem; color: var(--text-muted);
  font-family: var(--mono); letter-spacing: 0.05em;
}
.list-card { position: relative; }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 8px; }
.card-title { font-size: 0.88rem; font-weight: 700; flex: 1; letter-spacing: -0.02em; line-height: 1.3; color: var(--text); }
.source-tag {
  background: var(--blue-bg); color: var(--blue);
  padding: 3px 8px; border-radius: 20px; font-size: 0.68rem;
  font-weight: 600; white-space: nowrap; letter-spacing: -0.01em;
  flex-shrink: 0;
}
.card-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.chip {
  padding: 3px 9px; border-radius: 20px; font-size: 0.72rem;
  font-family: var(--mono); font-weight: 500;
  background: var(--bg); color: var(--text-secondary);
}
.chip-price { background: var(--green-bg); color: var(--green); font-weight: 600; box-shadow: inset 0 0 0 1px rgba(45,139,111,0.12); }
.chip-score {
  font-weight: 700; padding: 3px 11px; border-radius: 999px;
  font-family: var(--mono);
  box-shadow: inset 0 0 0 1px currentColor;
  position: relative;
}
.chip-score.green { background: var(--green-bg); color: var(--green); }
.chip-score.yellow { background: var(--yellow-bg); color: var(--yellow); }
.chip-score.red { background: var(--red-bg); color: var(--red); }
.card-notes {
  font-size: 0.78rem; color: var(--text-muted); margin-bottom: 10px;
  line-height: 1.45; letter-spacing: -0.01em;
}
.card-actions { display: flex; gap: 5px; }
.card-btn {
  background: var(--bg); border: none;
  color: var(--text-muted); padding: 4px 10px;
  border-radius: var(--radius-sm); font-size: 0.72rem;
  font-weight: 600; transition: all 0.15s;
}
.card-btn:hover { background: var(--bg-warm); color: var(--text-secondary); }
.card-btn.compare-active { background: var(--accent-light); color: var(--accent); }

/* List view */
.list-view { padding: 20px 32px; }
.list-table-wrap { overflow-x: auto; border-radius: var(--radius); box-shadow: var(--shadow); }
.list-table { border-collapse: collapse; width: 100%; font-size: 0.84rem; }
.list-table th {
  background: var(--bg-warm); font-weight: 700; font-size: 0.72rem;
  color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase;
  padding: 10px 14px; text-align: left; white-space: nowrap;
  position: sticky; top: 0;
}
.list-table td {
  background: var(--bg-card); padding: 12px 14px;
  border-bottom: 1px solid var(--border); vertical-align: middle;
}
.list-table tbody tr { cursor: pointer; transition: background 0.1s; }
.list-table tbody tr:hover td { background: var(--bg); }
.list-table .td-title {
  font-weight: 700; letter-spacing: -0.02em; color: var(--text);
  max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.list-table .td-mono { font-family: var(--mono); font-size: 0.82rem; color: var(--text-secondary); }
.list-table .td-make { font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
.list-table .td-price { font-family: var(--mono); font-weight: 500; color: var(--green); }
.list-table .td-actions { white-space: nowrap; }

/* Compare view */
.compare-view { padding: 20px 32px; }
.compare-filter {
  width: 100%; max-width: 320px; margin-bottom: 12px;
  background: var(--bg-card); border: 1px solid var(--border-strong); color: var(--text);
  padding: 8px 12px; border-radius: var(--radius-sm); font-size: 0.85rem;
  transition: border-color 0.15s;
}
.compare-filter:focus { outline: none; border-color: var(--accent); }
.compare-no-matches { color: var(--text-muted); font-size: 0.82rem; padding: 6px 2px; }
.compare-selectors-wrap { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 20px; }
.compare-selectors { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
.compare-toggle {
  background: var(--bg-card); border: 1px solid var(--border-strong);
  color: var(--text-secondary); padding: 7px 14px; border-radius: var(--radius-sm);
  font-size: 0.8rem; font-weight: 600; transition: all 0.15s;
}
.compare-toggle:hover { border-color: var(--accent); }
.compare-toggle.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.compare-clear-btn {
  background: var(--bg-card); border: 1px solid var(--border-strong);
  color: var(--text-muted); padding: 7px 12px; border-radius: var(--radius-sm);
  font-size: 0.75rem; font-weight: 600; transition: all 0.15s; white-space: nowrap; flex-shrink: 0;
}
.compare-clear-btn:hover { border-color: var(--red); color: var(--red); }
.compare-table-wrap {
  overflow-x: auto; border-radius: var(--radius);
  box-shadow: var(--shadow); animation: fadeUp 0.4s ease both;
}
.compare-table { border-collapse: collapse; width: 100%; font-size: 0.84rem; }
.compare-table th, .compare-table td {
  padding: 11px 16px; text-align: left;
  border-bottom: 1px solid var(--border);
}
.compare-table th {
  background: var(--bg-warm); font-weight: 700; font-size: 0.78rem;
  color: var(--text-secondary); letter-spacing: -0.01em;
}
.compare-table td { background: var(--bg-card); font-family: var(--mono); font-size: 0.82rem; color: var(--text-secondary); }
.compare-table tbody tr:hover td { background: var(--bg); }
.compare-table .best { background: var(--green-bg); color: var(--green); font-weight: 500; }
.compare-table .worst { background: var(--red-bg); color: var(--red); }
/* sticky first column on all screens */
.compare-table th:first-child,
.compare-table td:first-child {
  position: sticky; left: 0; z-index: 1; box-shadow: 1px 0 0 var(--border);
}
.compare-table th:first-child { background: var(--bg-warm); }
.compare-table td:first-child { background: var(--bg-card); }
.compare-table tbody tr:hover td:first-child { background: var(--bg); }
/* clickable car headers */
.compare-table thead th:not(:first-child) { position: relative; transition: background 0.12s, color 0.12s; padding-right: 34px; }
.compare-table thead th.winner { border-top: 2px solid var(--green); }
.compare-th-inner { cursor: pointer; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.compare-th-inner:hover .compare-th-title { color: var(--accent); }
.compare-winner-pill {
  display: inline-flex; align-items: center; gap: 3px;
  background: var(--green-bg); color: var(--green);
  font-size: 0.66rem; font-weight: 700; padding: 2px 7px;
  border-radius: 20px; letter-spacing: 0.02em; text-transform: uppercase;
}
.compare-remove-btn {
  position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
  width: 20px; height: 20px; border-radius: 50%;
  background: transparent; border: 1px solid var(--border-strong);
  color: var(--text-muted); font-size: 0.95rem; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.15s; padding: 0;
}
.compare-remove-btn:hover { border-color: var(--red); color: var(--red); background: var(--red-bg); }
/* chip strip hidden on desktop, shown on mobile */
.compare-chip-strip { display: none; }
/* score chip */
.compare-score-chip { display: inline-block; padding: 2px 10px; border-radius: 20px; font-weight: 700; font-family: var(--mono); font-size: 0.88rem; }
.compare-score-chip.green { background: var(--green-bg); color: var(--green); }
.compare-score-chip.yellow { background: var(--yellow-bg); color: var(--yellow); }
.compare-score-chip.red { background: var(--red-bg); color: var(--red); }
/* subscore rows */
.compare-subscore-row th { padding: 5px 16px 5px 28px !important; font-size: 0.72rem !important; color: var(--text-muted) !important; font-weight: 500 !important; letter-spacing: 0 !important; }
.compare-subscore-row td { padding: 5px 16px !important; }
.compare-mini-bar { height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; min-width: 60px; }
.compare-mini-bar-fill { height: 100%; border-radius: 3px; }
.compare-mini-bar-fill.green { background: var(--green); }
.compare-mini-bar-fill.yellow { background: var(--yellow); }
.compare-mini-bar-fill.red { background: var(--red); }
/* price drop badge */
.price-drop-badge { display: inline-block; margin-left: 6px; font-size: 0.7rem; color: var(--green); font-weight: 700; }
/* secondary metadata inline (age after year, distance after location) */
.compare-meta { color: var(--text-muted); font-weight: 400; margin-left: 4px; }

/* Detail panel */
.detail-overlay {
  display: none; position: fixed; inset: 0;
  background: var(--bg-overlay); z-index: 200;
  opacity: 0; transition: opacity 0.3s ease;
}
.detail-overlay.open { display: block; opacity: 1; }
.detail-panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: 440px; max-width: 92vw;
  background: var(--bg-card); z-index: 201;
  overflow-y: auto; transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  padding: 28px; box-shadow: var(--shadow-xl);
}
.detail-panel.open { transform: translateX(0); }
.detail-panel::-webkit-scrollbar { width: 4px; }
.detail-panel::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }
.detail-close {
  position: absolute; top: 20px; right: 20px;
  background: var(--bg); border: none; color: var(--text-muted);
  width: 32px; height: 32px; border-radius: 8px;
  font-size: 1.1rem; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.15s;
}
.detail-close:hover { background: var(--bg-warm); color: var(--text); }
.detail-title {
  font-size: 1.25rem; font-weight: 800; letter-spacing: -0.03em;
  margin-bottom: 8px; padding-right: 40px; line-height: 1.3;
}
.detail-badges { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
.status-badge {
  padding: 4px 12px; border-radius: 20px; font-size: 0.76rem;
  font-weight: 600; background: var(--bg); color: var(--text-secondary);
}
.detail-score { margin-bottom: 20px; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
.detail-chip {
  background: var(--bg); border-radius: var(--radius);
  padding: 14px 16px;
}
.detail-chip label {
  font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase;
  font-weight: 700; letter-spacing: 0.06em; display: block; margin-bottom: 4px;
}
.detail-chip span {
  font-size: 1.05rem; font-weight: 700; font-family: var(--mono);
  color: var(--text); letter-spacing: -0.02em;
}
.detail-section { margin-bottom: 20px; }
.detail-section h3 {
  font-size: 0.72rem; color: var(--text-muted); margin-bottom: 8px;
  text-transform: uppercase; font-weight: 700; letter-spacing: 0.06em;
}
.detail-notes {
  white-space: pre-wrap; font-size: 0.88rem; line-height: 1.6;
  background: var(--bg); padding: 14px 16px; border-radius: var(--radius);
  color: var(--text-secondary);
}
.price-history-item {
  display: flex; gap: 10px; align-items: baseline;
  padding: 8px 0; font-size: 0.84rem;
  border-bottom: 1px solid var(--border);
}
.price-history-item:last-child { border-bottom: none; }
.ph-price { color: var(--green); font-weight: 500; font-family: var(--mono); }
.ph-date { color: var(--text-muted); font-size: 0.75rem; font-family: var(--mono); }
.ph-note { color: var(--text-muted); font-size: 0.78rem; font-style: italic; }
.detail-actions { display: flex; gap: 8px; margin-top: 28px; }
.btn {
  padding: 9px 18px; border-radius: var(--radius-sm);
  font-size: 0.84rem; font-weight: 600; border: none;
  transition: all 0.15s; letter-spacing: -0.01em;
}
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(12,110,93,0.2); }
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(12,110,93,0.25); }
.btn-danger { background: var(--red-bg); color: var(--red); }
.btn-danger:hover { background: var(--red); color: #fff; }
.btn-link {
  background: var(--blue-bg); color: var(--blue); text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px; text-align: center;
  font-weight: 600; padding: 9px 18px; border-radius: var(--radius-sm);
  font-size: 0.84rem; transition: all 0.15s;
}
.btn-link:hover { background: var(--blue); color: #fff; }
.btn-link svg { width: 14px; height: 14px; }

/* Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: var(--bg-overlay); z-index: 300;
  align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg-card); border-radius: var(--radius-lg);
  padding: 32px; width: 520px; max-width: 92vw; max-height: 90vh;
  overflow-y: auto; box-shadow: var(--shadow-xl);
  animation: scaleIn 0.25s ease;
}
.modal::-webkit-scrollbar { width: 4px; }
.modal::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }
.modal h2 {
  font-size: 1.15rem; font-weight: 800; letter-spacing: -0.03em;
  margin-bottom: 24px; color: var(--text);
}
.form-group { margin-bottom: 14px; }
.form-group label {
  display: block; font-size: 0.72rem; color: var(--text-muted);
  margin-bottom: 5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.04em;
}
.form-group input, .form-group select, .form-group textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--border-strong);
  color: var(--text); padding: 10px 14px; border-radius: var(--radius-sm);
  font-size: 0.88rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px rgba(12,110,93,0.08);
}
.form-group input::placeholder, .form-group textarea::placeholder { color: var(--text-muted); }
.form-group textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
.form-group select { cursor: pointer; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; }

/* Dialog (confirm / prompt) */
.dialog-message {
  color: var(--text-secondary); font-size: 0.88rem; line-height: 1.5;
  margin-bottom: 18px;
}
.dialog-message[hidden] { display: none; }
.dialog .form-group { margin-bottom: 0; }
.btn-secondary {
  background: var(--bg); border: none; color: var(--text-secondary);
  font-weight: 600;
}
.btn-secondary:hover { background: var(--bg-warm); }
.price-change-reason { display: none; }
.price-change-reason.show { display: block; }

.view { display: none; }
.view.active { display: block; }
.pipeline.active { display: flex; }

.empty-state {
  text-align: center; padding: 40px 20px; color: var(--text-muted);
  font-size: 0.84rem; font-weight: 500;
}
.empty-state-icon {
  font-size: 2rem; margin-bottom: 8px; opacity: 0.4;
}

/* Scrollbar global */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 3px; }

/* Status-specific column accents */
.pipeline-col[data-status="to-contact"] .pipeline-col-header { border-left: 3px solid var(--text-muted); padding-left: 13px; }
.pipeline-col[data-status="contacted"] .pipeline-col-header { border-left: 3px solid var(--blue); padding-left: 13px; }
.pipeline-col[data-status="inactive"] .pipeline-col-header { border-left: 3px solid var(--yellow); padding-left: 13px; }
.pipeline-col[data-status="negotiating"] .pipeline-col-header { border-left: 3px solid #E8873A; padding-left: 13px; }
.pipeline-col[data-status="rejected"] .pipeline-col-header { border-left: 3px solid var(--red); padding-left: 13px; }
.pipeline-col[data-status="bought"] .pipeline-col-header { border-left: 3px solid var(--green); padding-left: 13px; }

/* Drag-and-drop */
.pipeline-col {
  transition: box-shadow var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease);
}
.pipeline-col.drag-over {
  box-shadow: inset 0 0 0 2px var(--accent);
  background: var(--accent-soft);
}
.car-card[draggable="true"] { cursor: grab; }
.car-card[draggable="true"]:active { cursor: grabbing; opacity: 0.8; }
.car-card.is-dragging { opacity: 0.4; }

/* Icon action buttons */
.icon-btn {
  background: none; border: none; color: var(--text-muted);
  padding: 5px 7px; border-radius: var(--radius-sm);
  font-size: 0.9rem; line-height: 1; transition: all 0.15s;
  display: inline-flex; align-items: center; justify-content: center;
}
.icon-btn:hover { background: var(--bg-warm); color: var(--text); }
.icon-btn svg { width: 14px; height: 14px; pointer-events: none; }

/* Status badge colors */
.status-badge.to-contact { background: var(--bg-warm); color: var(--text-muted); }
.status-badge.contacted { background: var(--blue-bg); color: var(--blue); }
.status-badge.inactive { background: var(--yellow-bg); color: var(--yellow); }
.status-badge.negotiating { background: #FFF0E5; color: #E8873A; }
.status-badge.rejected { background: var(--red-bg); color: var(--red); }
.status-badge.bought { background: var(--green-bg); color: var(--green); }

/* Inferred field highlight */
.field-inferred { border-left: 2px solid var(--accent) !important; }

/* Score breakdown (detail panel) */
.score-breakdown {
  background: var(--bg); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 20px;
}
.score-breakdown-row {
  display: grid; grid-template-columns: auto 1fr auto auto;
  gap: 10px; align-items: center;
  padding: 6px 0;
  font-size: 0.82rem;
}
.score-breakdown-row + .score-breakdown-row { border-top: 1px solid var(--border); }
.score-breakdown-label { color: var(--text-secondary); font-weight: 600; letter-spacing: -0.01em; }
.score-breakdown-weight { font-size: 0.7rem; color: var(--text-muted); font-family: var(--mono); }
.score-breakdown-bar { height: 6px; background: var(--bg-warm); border-radius: 3px; overflow: hidden; min-width: 60px; }
.score-breakdown-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s; }
.score-breakdown-bar-fill.low { background: var(--red); }
.score-breakdown-bar-fill.mid { background: var(--yellow); }
.score-breakdown-value { font-family: var(--mono); color: var(--text); font-weight: 600; min-width: 32px; text-align: right; }
.score-breakdown-reason {
  grid-column: 1 / -1; font-size: 0.76rem;
  color: var(--text-muted); font-style: italic;
  padding: 2px 0 4px; line-height: 1.4;
}
.score-breakdown-reason.pos { color: var(--green); font-style: normal; }
.score-breakdown-reason.neg { color: var(--red); font-style: normal; }

/* Docs view */
.docs-view { padding: 30px 32px 60px; max-width: 880px; margin: 0 auto; }
.docs-view h2 {
  font-size: 1.6rem; font-weight: 800; letter-spacing: -0.03em;
  margin-bottom: 6px; color: var(--text);
}
.docs-view .docs-sub {
  color: var(--text-muted); font-size: 0.92rem;
  margin-bottom: 28px; line-height: 1.5; letter-spacing: -0.01em;
}
.docs-section {
  background: var(--bg-card); border-radius: var(--radius-lg);
  padding: 24px 28px; margin-bottom: 18px; box-shadow: var(--shadow-sm);
}
.docs-section h3 {
  font-size: 1.05rem; font-weight: 700; letter-spacing: -0.02em;
  margin-bottom: 12px; color: var(--text);
}
.docs-section p, .docs-section li {
  font-size: 0.9rem; color: var(--text-secondary);
  line-height: 1.6; letter-spacing: -0.005em;
}
.docs-section p { margin-bottom: 10px; }
.docs-section ul { list-style: none; padding: 0; margin: 6px 0 10px; }
.docs-section li { padding: 5px 0; border-bottom: 1px solid var(--border); }
.docs-section li:last-child { border-bottom: none; }
.docs-section strong { color: var(--text); font-weight: 700; }
.docs-section code {
  font-family: var(--mono); font-size: 0.82rem;
  background: var(--bg); padding: 2px 7px; border-radius: 4px;
  color: var(--accent);
}
.docs-weights {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px; margin-top: 8px;
}
.docs-weight-card {
  background: var(--bg-card); padding: 14px 16px;
  border-radius: var(--radius); border: 1px solid var(--border-strong);
}
.docs-weight-card .w-top {
  display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;
}
.docs-weight-card .w-label { font-size: 0.85rem; font-weight: 600; color: var(--text); letter-spacing: -0.01em; }
.docs-weight-card .w-value {
  font-family: var(--mono); font-size: 0.72rem; font-weight: 700;
  color: var(--accent); background: var(--accent-light);
  padding: 2px 7px; border-radius: 20px; flex-shrink: 0; margin-left: 8px;
}
.docs-weight-card .w-hint { font-size: 0.78rem; color: var(--text-muted); line-height: 1.4; }
.docs-engines { display: grid; gap: 8px; margin-top: 8px; }
.docs-engine-row {
  display: grid; grid-template-columns: 140px 60px 1fr;
  gap: 12px; padding: 9px 12px;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  background: var(--bg);
  align-items: center;
}
.docs-engine-row.pos { background: var(--green-bg); }
.docs-engine-row.neg { background: var(--red-bg); }
.docs-engine-label { font-family: var(--mono); font-weight: 600; color: var(--text); font-size: 0.82rem; }
.docs-engine-delta {
  font-family: var(--mono); font-weight: 700; text-align: center;
  padding: 2px 6px; border-radius: 20px; font-size: 0.78rem;
  background: var(--bg-card);
}
.docs-engine-row.pos .docs-engine-delta { color: var(--green); }
.docs-engine-row.neg .docs-engine-delta { color: var(--red); }
.docs-engine-reason { color: var(--text-secondary); font-size: 0.82rem; line-height: 1.4; }
.docs-makes { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px; margin-top: 8px; }
.docs-make-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 12px; background: var(--bg); border-radius: var(--radius-sm);
  font-size: 0.84rem;
}
.docs-make-row .m-name { color: var(--text); font-weight: 600; }
.docs-make-row .m-score { font-family: var(--mono); font-weight: 700; }
.docs-make-row .m-score.green { color: var(--green); }
.docs-make-row .m-score.yellow { color: var(--yellow); }
.docs-make-row .m-score.red { color: var(--red); }
.docs-sources { font-size: 0.78rem; color: var(--text-muted); line-height: 1.6; }
.docs-sources a { color: var(--accent); text-decoration: none; }
.docs-sources a:hover { text-decoration: underline; }

/* ===== Skeletons ===== */
.skeleton {
  background: linear-gradient(
    90deg,
    var(--bg-warm) 0%,
    rgba(255,255,255,0.65) 50%,
    var(--bg-warm) 100%
  );
  background-size: 800px 100%;
  animation: shimmer 1.4s linear infinite;
  border-radius: var(--radius-sm);
}
.skel-line { height: 12px; width: 100%; }
.sk-h-10 { height: 10px; }
.sk-h-14 { height: 14px; }
.sk-h-20 { height: 20px; }
.sk-h-36 { height: 36px; }
.sk-w-40 { width: 40%; }
.sk-w-60 { width: 60%; }
.sk-w-70 { width: 70%; }
.sk-w-80 { width: 80%; }
.skel-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 10px;
  box-shadow: var(--shadow-sm);
}
.skel-chips { display: flex; gap: 5px; }
.skel-chip { height: 18px; width: 46px; border-radius: 999px; }

/* ===== Toasts ===== */
.toast-stack {
  position: fixed; bottom: 20px; right: 20px; z-index: 400;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none; max-width: 360px;
}
.toast {
  pointer-events: auto;
  background: var(--bg-card);
  color: var(--text);
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  box-shadow: var(--shadow-lg);
  padding: 12px 16px;
  font-size: 0.85rem; font-weight: 500;
  letter-spacing: -0.01em;
  min-width: 220px;
  animation: slideIn 0.25s var(--ease) both;
  display: flex; align-items: center; gap: 10px;
  line-height: 1.35;
}
.toast.leaving { animation: slideOutRight 0.2s var(--ease) forwards; }
.toast.error { border-left-color: var(--red); }
.toast.info { border-left-color: var(--blue); }
.toast-icon {
  width: 16px; height: 16px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
}
.toast.success .toast-icon { color: var(--accent); }
.toast.error .toast-icon { color: var(--red); }
.toast.info .toast-icon { color: var(--blue); }
.toast-msg { flex: 1; }
.toast-action {
  background: none; border: none; color: var(--accent);
  font-weight: 700; font-size: 0.78rem; padding: 4px 8px;
  border-radius: var(--radius-sm); cursor: pointer;
  text-transform: uppercase; letter-spacing: 0.05em;
}
.toast-action:hover { background: var(--accent-soft); }

/* ===== Global spinner (top-right, ref-counted) ===== */
.global-spinner {
  position: fixed; top: 74px; right: 20px; z-index: 150;
  width: 20px; height: 20px;
  pointer-events: none;
}
.global-spinner::after {
  content: '';
  display: block; width: 100%; height: 100%;
  border: 2px solid var(--border-strong);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

/* Inline button spinner */
.btn-loading { position: relative; color: transparent !important; pointer-events: none; }
.btn-loading::after {
  content: '';
  position: absolute; top: 50%; left: 50%;
  width: 14px; height: 14px; margin: -7px 0 0 -7px;
  border: 2px solid rgba(255,255,255,0.35);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
.btn-secondary.btn-loading::after {
  border-color: rgba(30,28,24,0.2);
  border-top-color: var(--text);
}

/* ===== Empty/error states ===== */
.empty-state.error { color: var(--red); }
.empty-state .empty-state-retry {
  margin-top: 12px;
  background: var(--accent); color: #fff; border: none;
  padding: 8px 18px; border-radius: var(--radius-md);
  font-size: 0.8rem; font-weight: 700; cursor: pointer;
  transition: background var(--dur-fast) var(--ease);
}
.empty-state .empty-state-retry:hover { background: var(--accent-hover); }

/* ===== List mobile cards ===== */
.list-cards { display: none; flex-direction: column; gap: 10px; }
.list-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
  display: flex; flex-direction: column; gap: 8px;
  box-shadow: var(--shadow-sm);
  animation: fadeUp 0.25s var(--ease) both;
}
.list-card .lc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.list-card .lc-title { font-weight: 700; letter-spacing: -0.02em; font-size: 0.92rem; line-height: 1.3; flex: 1; }
.list-card .lc-meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.76rem; }
.list-card .lc-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 2px; }

/* ===== Tablet breakpoint ===== */
@media (max-width: 960px) {
  .header { padding: 0 20px; gap: 20px; }
  .filter-bar { padding: 12px 20px; }
  .pipeline { padding: 16px 20px; gap: 12px; }
  .list-view, .compare-view { padding: 16px 20px; }
  .docs-view { padding: 24px 20px 60px; }
  .pipeline-col { min-width: 240px; }
  .list-table .td-mono:nth-child(3), .list-table th:nth-child(3) { display: none; } /* hide Local */
}

/* ===== Mobile breakpoint (≤640px) ===== */
@media (max-width: 640px) {
  .header {
    padding: 0 14px; gap: 10px; height: 56px;
    overflow-x: auto; scrollbar-width: none;
  }

<script>
// --- State ---
let cars = [];
let currentView = 'pipeline';
let selectedForCompare = new Set();
let compareFilter = '';
let listSort = { field: 'addedAt', asc: false };
let listFilters = {
  sources: [], makes: [], statuses: [], fuels: [],
  yearMin: null, yearMax: null,
  kmMin: null, kmMax: null,
  priceMin: null, priceMax: null,
  scoreMin: null, scoreMax: null
};
const LIST_COL_META = {
  source:  { type: 'categorical', key: 'sources',  title: 'Source'   },
  make:    { type: 'categorical', key: 'makes',    title: 'Make'     },
  status:  { type: 'categorical', key: 'statuses', title: 'Status'   },
  fuel:    { type: 'categorical', key: 'fuels',    title: 'Fuel'     },
  year:    { type: 'range',       minKey: 'yearMin',  maxKey: 'yearMax',  title: 'Year',  placeholder: ['From', 'To'] },
  km:      { type: 'range',       minKey: 'kmMin',    maxKey: 'kmMax',    title: 'Km',    placeholder: ['Min', 'Max'] },
  price:   { type: 'range',       minKey: 'priceMin', maxKey: 'priceMax', title: 'Price', placeholder: ['Min \u20AC', 'Max \u20AC'] },
  score:   { type: 'range',       minKey: 'scoreMin', maxKey: 'scoreMax', title: 'Score', placeholder: ['Min', 'Max'] }
};
function listFilterIsActive(col) {
  const m = LIST_COL_META[col]; if (!m) return false;
  if (m.type === 'categorical') return (listFilters[m.key] || []).length > 0;
  return listFilters[m.minKey] != null || listFilters[m.maxKey] != null;
}
function listActiveFilterCount() {
  return Object.keys(LIST_COL_META).filter(listFilterIsActive).length;
}
function resetListFilters() {
  listFilters = {
    sources: [], makes: [], statuses: [], fuels: [],
    yearMin: null, yearMax: null,
    kmMin: null, kmMax: null,
    priceMin: null, priceMax: null,
    scoreMin: null, scoreMax: null
  };
}
let editingOriginalPrice = null;
const state = {
  loading: true,
  hasError: false,
  suppressRefreshUntil: 0,
  refreshTimer: null,
  refreshInterval: null,
  spinnerCount: 0
};
const isMobile = () => window.matchMedia('(max-width: 640px)').matches;

const STATUSES = [
  { key: 'to-contact', label: 'To Contact' },
  { key: 'contacted', label: 'Contacted' },
  { key: 'inactive', label: 'Inactive' },
  { key: 'negotiating', label: 'Negotiating' },
  { key: 'rejected', label: 'Rejected' },
  { key: 'bought', label: 'Bought' }
];

const STATUS_LABELS = Object.fromEntries(STATUSES.map(s => [s.key, s.label]));

// --- URL Inference ---
const SOURCE_MAP = {
  'standvirtual.com': 'StandVirtual',
  'autoscout24.pt': 'AutoScout24',
  'olx.pt': 'OLX',
  'facebook.com': 'Facebook Marketplace',
  'piscapisca.pt': 'PiscaPisca',
  'custojusto.pt': 'CustoJusto'
};

// Canonical casing for engine codes seen in slugs
const ENGINE_CODES = {
  tdi: 'TDI', tsi: 'TSI', dci: 'dCi', hdi: 'HDi', tdci: 'TDCi',
  cdti: 'CDTi', crdi: 'CRDi', multijet: 'Multijet',
  vvti: 'VVT-i', vtec: 'VTEC', mpi: 'MPI', fsi: 'FSI',
  bluehdi: 'BlueHDi', blueefficiency: 'BlueEfficiency',
  ecoboost: 'EcoBoost', ecotec: 'Ecotec', d4d: 'D-4D',
  skyactiv: 'SkyActiv', tce: 'TCe', dig: 'DIG',
  jtd: 'JTD', jtdm: 'JTDm'
};
const ENGINE_CODE_RE = new RegExp('^(' + Object.keys(ENGINE_CODES).join('|') + ')$');

// Extra makes to recognise in URL slugs (datalist covers the common PT subset)
const EXTRA_MAKES = [
  'Alfa Romeo', 'Aston Martin', 'Chevrolet', 'Chrysler', 'DS', 'Dodge',
  'Jaguar', 'Jeep', 'Lancia', 'Land Rover', 'Lexus', 'Mini', 'Porsche',
  'Saab', 'Smart', 'Subaru', 'Tesla', 'Citroen'
];

const FUEL_MAP = { diesel: 'Diesel', gasolina: 'Gasolina', gasoline: 'Gasolina', petrol: 'Gasolina' };

let _knownMakesCache = null;
function getKnownMakes() {
  if (_knownMakesCache) return _knownMakesCache;
  const fromDatalist = Array.from(document.querySelectorAll('#makes-list option')).map(o => o.value);
  const all = [...fromDatalist, ...EXTRA_MAKES];
  const entries = all.map(m => ({
    canonical: m,
    parts: m.toLowerCase().split(/[\s-]+/).filter(Boolean)
  }));
  entries.sort((a, b) => b.parts.length - a.parts.length);
  _knownMakesCache = entries;
  return entries;
}

let _locationKeysCache = null;
function getLocationKeys() {
  if (_locationKeysCache) return _locationKeysCache;
  _locationKeysCache = Object.keys(LOCATION_DISTANCES)
    .map(k => ({ key: k, parts: k.split(' ') }))
    .sort((a, b) => b.parts.length - a.parts.length);
  return _locationKeysCache;
}

function tokenizeUrl(url) {
  let s;
  try { s = decodeURIComponent(url); } catch { s = url; }
  s = s.toLowerCase().replace(/^https?:\/\/[^/]+/, '');
  return s.split(/[^a-z0-9.]+/).filter(Boolean);
}

function titleCaseToken(t) {
  if (/^[ivx]+$/i.test(t)) return t.toUpperCase();
  return t.charAt(0).toUpperCase() + t.slice(1);
}

function classifyTokens(tokens) {
  const currentYear = new Date().getFullYear();
  const result = {};
  const consumed = new Array(tokens.length).fill(false);
  const claim = (i, key, val) => {
    if (result[key] == null) { result[key] = val; consumed[i] = true; return true; }
    return false;
  };

  // Pass 1: unambiguous numerics + keywords
  for (let i = 0; i < tokens.length; i++) {
    if (consumed[i]) continue;
    const t = tokens[i];

    if (/^(19|20)\d{2}$/.test(t)) {
      const y = Number(t);
      if (y >= 1990 && y <= currentYear) { claim(i, 'year', y); continue; }
    }

    let m = t.match(/^(\d{2,4})(cv|hp|ps)$/);
    if (m) { claim(i, 'power', Number(m[1])); continue; }
    m = t.match(/^(\d{2,3})kw$/);
    if (m) { claim(i, 'power', Math.round(Number(m[1]) * 1.36)); continue; }

    m = t.match(/^(\d{2,3})k$/);
    if (m) { claim(i, 'km', Number(m[1]) * 1000); continue; }
    m = t.match(/^(\d{4,6})km$/);
    if (m) { claim(i, 'km', Number(m[1])); continue; }

    m = t.match(/^(\d{3,6})eur?s?$/);
    if (m) { claim(i, 'price', Number(m[1])); continue; }

    if (FUEL_MAP[t]) { claim(i, 'fuel', FUEL_MAP[t]); continue; }

    // Engine displacement "1.5" optionally followed by code token
    if (/^[1-6]\.\d$/.test(t)) {
      if (result.engine == null) {
        const next = i + 1 < tokens.length ? tokens[i + 1] : null;
        const code = next && ENGINE_CODES[next] ? ENGINE_CODES[next] : null;
        result.engine = code ? `${t} ${code}` : t;
        consumed[i] = true;
        if (code) consumed[i + 1] = true;
      }
      continue;
    }
    // Compact form "15dci" / "20tdi"
    m = t.match(/^([1-6])(\d)([a-z]+)$/);
    if (m && ENGINE_CODES[m[3]]) {
      if (result.engine == null) {
        result.engine = `${m[1]}.${m[2]} ${ENGINE_CODES[m[3]]}`;
        consumed[i] = true;
      }
      continue;
    }
    // Split form "1-5-dci" arrives as tokens ["1","5","dci"] — handle: digit, ".digit", code
    if (/^[1-6]$/.test(t) && i + 2 < tokens.length
        && /^\d$/.test(tokens[i + 1]) && ENGINE_CODES[tokens[i + 2]]) {
      if (result.engine == null) {
        result.engine = `${t}.${tokens[i + 1]} ${ENGINE_CODES[tokens[i + 2]]}`;
        consumed[i] = consumed[i + 1] = consumed[i + 2] = true;
      }
      continue;
    }
  }

  // Pass 2: bare km numbers
  for (let i = 0; i < tokens.length; i++) {
    if (consumed[i]) continue;
    if (/^\d+$/.test(tokens[i])) {
      const n = Number(tokens[i]);
      if (n >= 5000 && n <= 600000 && !(n >= 1990 && n <= currentYear)) {
        if (claim(i, 'km', n)) continue;
      }
    }
  }

  // Pass 3: locations (multi-word first)
  for (const { parts } of getLocationKeys()) {
    for (let i = 0; i <= tokens.length - parts.length; i++) {
      let hit = true;
      for (let k = 0; k < parts.length; k++) {
        if (consumed[i + k] || tokens[i + k] !== parts[k]) { hit = false; break; }
      }
      if (hit) {
        result.location = parts.map(titleCaseToken).join(' ');
        for (let k = 0; k < parts.length; k++) consumed[i + k] = true;
        break;
      }
    }
    if (result.location != null) break;
  }

  // Pass 4: make (multi-word first)
  let makeIdx = -1, makeLen = 0;
  for (const { parts, canonical } of getKnownMakes()) {
    for (let i = 0; i <= tokens.length - parts.length; i++) {
      let hit = true;
      for (let k = 0; k < parts.length; k++) {
        if (consumed[i + k] || tokens[i + k] !== parts[k]) { hit = false; break; }
      }
      if (hit) {
        result.make = canonical;
        for (let k = 0; k < parts.length; k++) consumed[i + k] = true;
        makeIdx = i;
        makeLen = parts.length;
        break;
      }
    }
    if (makeIdx >= 0) break;
  }

  // Pass 5: model — consume tokens immediately after make, stop at a claimed/junk token
  if (makeIdx >= 0) {
    const modelParts = [];
    for (let i = makeIdx + makeLen; i < tokens.length && modelParts.length < 4; i++) {
      if (consumed[i]) break;
      const t = tokens[i];
      if (/^\d+$/.test(t) && t.length > 3) break;  // long numbers = listing IDs
      if (/^id\w*\d/.test(t)) break;                // "id123..." alphanumeric IDs
      if (ENGINE_CODE_RE.test(t)) break;
      modelParts.push(t);
      consumed[i] = true;
    }
    if (modelParts.length) result.model = modelParts.map(titleCaseToken).join(' ');
  }

  return result;
}

function inferFromUrl(url) {
  if (!url) return;
  let parsed;
  try { parsed = new URL(url); } catch { return; }

  const hostname = parsed.hostname.replace(/^www\./, '');
  const inferred = {};
  const src = SOURCE_MAP[hostname];
  if (src) inferred.source = src;

  const tokens = tokenizeUrl(url);
  Object.assign(inferred, classifyTokens(tokens));

  const FIELD_MAP = {
    source:   'form-source',
    make:     'form-make',
    model:    'form-model',
    year:     'form-year',
    km:       'form-km',
    price:    'form-price',
    fuel:     'form-fuel',
    engine:   'form-engine',
    power:    'form-power',
    location: 'form-location'
  };

  for (const [key, id] of Object.entries(FIELD_MAP)) {
    if (inferred[key] == null) continue;
    const el = document.getElementById(id);
    if (!el || el.value) continue;
    el.value = inferred[key];
    el.classList.add('field-inferred');
  }

  updateModelDatalist(document.getElementById('form-make').value);
  maybeAutoTitle();
}

function maybeAutoTitle() {
  const titleEl = document.getElementById('form-title');
  if (!titleEl) return;
  if (titleEl.value && !titleEl.classList.contains('field-inferred')) return;
  const make = document.getElementById('form-make').value.trim();
  const model = document.getElementById('form-model').value.trim();
  const engine = document.getElementById('form-engine').value.trim();
  const year = document.getElementById('form-year').value.trim();
  const parts = [make, model, engine, year].filter(Boolean);
  if (!parts.length) return;
  titleEl.value = parts.join(' ');
  titleEl.classList.add('field-inferred');
}

function updateModelDatalist(make) {
  const dl = document.getElementById('models-list');
  if (!make) { dl.innerHTML = ''; return; }
  const models = [...new Set(
    cars.filter(c => c.make && c.make.toLowerCase() === make.toLowerCase() && c.model)
        .map(c => c.model)
  )].sort();
  dl.innerHTML = models.map(m => `<option value="${esc(m)}">`).join('');
}

// Engine-level adjustments. First pattern to match wins.
// Patterns are tested against title + notes + engine.
const ENGINE_PROFILES = [
  // Stellar
  { re: /1\.4\s*d[- ]?4d/i, delta: 18, reason: 'Toyota 1.4 D-4D — ultra-reliable, documented 300k+ km units.' },
  { re: /vvt[- ]?i/i, delta: 14, reason: 'Toyota VVT-i petrol — bulletproof, cheap to maintain.' },
  { re: /1\.9\s*tdi/i, delta: 12, reason: 'VAG 1.9 TDI (PD/non-PD) — legendary longevity.' },
  { re: /1\.9\s*(multijet|jtd)/i, delta: 10, reason: 'Fiat/Alfa 1.9 Multijet — robust, unlike the 1.3 variant.' },
  { re: /honda\b.*\b(i-vtec|vtec)/i, delta: 12, reason: 'Honda VTEC petrol — extremely durable.' },
  { re: /mazda\b.*\b(mzr|skyactiv)/i, delta: 8, reason: 'Mazda MZR / SkyActiv — generally reliable.' },
  // Solid
  { re: /1\.0\s*tsi.*ea211|1\.2\s*tsi.*ea211/i, delta: 5, reason: 'VW EA211 TSI (post-2013) — fixed the timing chain issues.' },
  { re: /1\.5\s*tdci|1\.6\s*tdci/i, delta: 2, reason: 'Ford 1.5/1.6 TDCi — refined PSA block, reasonably reliable.' },
  // Problem engines
  { re: /1\.3\s*(multijet|m[- ]?jet|jtd|cdti)/i, delta: -16, reason: 'Fiat/Opel 1.3 Multijet/JTD/CDTi — timing chain stretch 120–150k km, EGR/DPF clogs, turbo failures. Widely flagged as "motor a evitar".' },
  { re: /1\.4\s*(hdi|tdci)/i, delta: -10, reason: 'PSA 1.4 HDi / Ford 1.4 TDCi — injector and FAP issues, oil sludge.' },
  { re: /1\.6\s*tdi(?!.*ea288)/i, delta: -9, reason: 'VW 1.6 TDI common-rail (EA189) — injector/EGR issues, sensitive to urban use, DieselGate era.' },
  { re: /1\.5\s*dci/i, delta: -5, reason: 'Renault 1.5 dCi (K9K) — mixed track record; early units plagued by injectors and turbo failure.' },
  { re: /1\.6\s*hdi/i, delta: -4, reason: 'PSA 1.6 HDi — early units (pre-2010) had injector seal failures; FAP additive management needed.' },
  { re: /2\.0\s*tdi.*(cbab|cbdb|cfgb)|2\.0\s*tdi.*pd/i, delta: -6, reason: '2.0 TDI PD / early CR — oil pump balance-shaft failures, FAP issues.' },
  { re: /1\.2\s*tsi(?!.*ea211)/i, delta: -10, reason: 'VW 1.2 TSI (EA111, pre-2013) — timing chain stretch, tensioner failures.' },
  { re: /1\.4\s*tsi/i, delta: -10, reason: 'VW 1.4 TSI — timing chain, carbon build-up, oil consumption.' },
  { re: /1\.2\s*tdi/i, delta: -4, reason: 'VW 1.2 TDI 3-cyl — fragile in cold starts, DPF issues on short trips.' }
];

function locationScore(location) {
  if (!location) return 50;
  const loc = location.toLowerCase().trim();
  for (const [place, dist] of Object.entries(LOCATION_DISTANCES)) {
    // Max 30 points lost across 600km so distance never buries an otherwise great car.
    if (loc.includes(place)) return Math.max(0, Math.round(100 - (dist / 600) * 30));
  }
  return 50;
}

function locationKm(location) {
  if (!location) return null;
  const loc = location.toLowerCase().trim();
  for (const [place, dist] of Object.entries(LOCATION_DISTANCES)) {
    if (loc.includes(place)) return dist;
  }
  return null;
}

function getMakeReliability(make) {
  if (!make) return 60;
  const key = make.toLowerCase().trim();
  if (MAKE_RELIABILITY[key] !== undefined) return MAKE_RELIABILITY[key];
  for (const k in MAKE_RELIABILITY) {
    if (key.includes(k) || k.includes(key)) return MAKE_RELIABILITY[k];
  }
  return 60;
}

function getEngineProfile(car) {
  const blob = [car.title, car.notes, car.engine].filter(Boolean).join(' ');
  if (!blob) return null;
  for (const p of ENGINE_PROFILES) {
    if (p.re.test(blob)) return p;
  }
  return null;
}

function kmSubscore(car) {
  if (!car.km) return 50;
  // Sweet-spot plateau then linear decay to end-of-life. Petrol ages faster than diesel.
  // Below the plateau we don't reward suspiciously low km (rollback is common on old cars).
  const petrol = car.fuel === 'Gasolina';
  const sweetUpper = petrol ? 90000 : 130000;
  const endOfLife = petrol ? 200000 : 280000;
  if (car.km <= sweetUpper) return 100;
  if (car.km >= endOfLife) return 0;
  return Math.round(100 - ((car.km - sweetUpper) / (endOfLife - sweetUpper)) * 100);
}

function priceSubscore(car) {
  if (!car.price) return 50;
  // Plateau at 100 up to €2500 (anything cheaper is a scam risk, not a deal), decay to 0 at €5000 ceiling.
  if (car.price <= 2500) return 100;
  if (car.price >= 5000) return 0;
  return Math.round(100 - ((car.price - 2500) / 2500) * 100);
}

function yearSubscore(car) {
  if (!car.year) return 50;
  // 2005 → 0, 2020 → 100
  return Math.max(0, Math.min(100, Math.round(((car.year - 2005) / 15) * 100)));
}

function reliabilitySubscore(car) {
  const base = getMakeReliability(car.make);
  const profile = getEngineProfile(car);
  const delta = profile ? profile.delta : 0;
  return {
    score: Math.max(0, Math.min(100, base + delta)),
    base, delta,
    reason: profile ? profile.reason : null
  };
}

const SCORE_WEIGHTS = { km: 0.22, price: 0.22, reliability: 0.30, year: 0.13, location: 0.13 };

function computeScoreBreakdown(car) {
  const km = kmSubscore(car);
  const price = priceSubscore(car);
  const year = yearSubscore(car);
  const loc = locationScore(car.location);
  const rel = reliabilitySubscore(car);
  const total = Math.round(
    km * SCORE_WEIGHTS.km +
    price * SCORE_WEIGHTS.price +
    rel.score * SCORE_WEIGHTS.reliability +
    year * SCORE_WEIGHTS.year +
    loc * SCORE_WEIGHTS.location
  );
  return { total, km, price, year, loc, rel };
}

function computeScore(car) {
  return computeScoreBreakdown(car).total;
}

function scoreClass(score) {
  if (score >= 75) return 'green';
  if (score >= 50) return 'yellow';
  return 'red';
}

// --- Toasts ---
const TOAST_ICONS = {
  success: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l3.5 3.5L13 5"/></svg>',
  error: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  info: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 7v4M8 4.5v.01"/><circle cx="8" cy="8" r="6"/></svg>'
};
const _toastRecent = new Map();
function toast(msg, variant = 'success', opts = {}) {
  const stack = document.getElementById('toast-stack');
  if (!stack) return;
  // Coalesce identical messages within 1s
  const key = variant + '|' + msg;
  const last = _toastRecent.get(key);
  if (last && Date.now() - last < 1000) return;
  _toastRecent.set(key, Date.now());

  // Cap visible toasts at 3 — remove the oldest
  while (stack.children.length >= 3) stack.removeChild(stack.firstChild);

  const el = document.createElement('div');
  el.className = 'toast ' + variant;
  el.innerHTML = `<span class="toast-icon">${TOAST_ICONS[variant] || ''}</span><span class="toast-msg"></span>`;
  el.querySelector('.toast-msg').textContent = msg;

  if (opts.action) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'toast-action';
    btn.textContent = opts.action.label;
    btn.addEventListener('click', () => {
      try { opts.action.onClick?.(); } finally { dismiss(); }
    });
    el.appendChild(btn);
  }

  const duration = opts.duration ?? (variant === 'error' ? 5000 : 2800);
  let timeoutId = setTimeout(dismiss, duration);
  el.addEventListener('mouseenter', () => clearTimeout(timeoutId));
  el.addEventListener('mouseleave', () => { timeoutId = setTimeout(dismiss, 1500); });

  function dismiss() {
    if (!el.isConnected) return;
    el.classList.add('leaving');
    el.addEventListener('animationend', () => el.remove(), { once: true });
  }

  stack.appendChild(el);
}

// --- Ref-counted global spinner ---
function showSpinner() {
  state.spinnerCount++;
  if (state.spinnerCount === 1) {
    document.getElementById('global-spinner').hidden = false;
  }
}
function hideSpinner() {
  state.spinnerCount = Math.max(0, state.spinnerCount - 1);
  if (state.spinnerCount === 0) {
    document.getElementById('global-spinner').hidden = true;
  }
}

// --- API ---
async function getApiSecret() {
  let secret = localStorage.getItem('apiSecret');
  if (!secret) {
    secret = (await showPrompt({
      title: 'App password',
      message: 'Enter the shared password to unlock the tracker.',
      type: 'password',
      confirmLabel: 'Unlock',
    })) || '';
    if (secret) localStorage.setItem('apiSecret', secret);
  }
  return secret;
}

async function apiFetch(path, opts = {}) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 12000);
  const headers = { ...(opts.headers || {}), 'x-api-secret': await getApiSecret() };
  try {
    const res = await fetch(path, { ...opts, headers, signal: controller.signal });
    if (res.status === 401) {
      localStorage.removeItem('apiSecret');
      toast('Session expired. Reloading…', 'error');
      setTimeout(() => location.reload(), 1400);
      throw new Error('Unauthorized');
    }
    if (!res.ok && res.status !== 204) {
      let msg = 'Request failed (' + res.status + ')';
      try {
        const body = await res.clone().json();
        if (body?.error) msg = body.error;
      } catch {}
      const err = new Error(msg);
      err.status = res.status;
      throw err;
    }
    return res;
  } catch (e) {
    if (e.name === 'AbortError') {
      const err = new Error('Request timed out');
      err.status = 0;
      throw err;
    }
    throw e;
  } finally {
    clearTimeout(timeout);
  }
}

// --- Optimistic mutate helper ---
async function mutate({ optimistic, request, rollback, successMsg, errorMsg }) {
  const snap = optimistic ? optimistic() : null;
  render();
  showSpinner();
  try {
    const data = await request();
    if (successMsg) toast(successMsg, 'success');
    return data;
  } catch (e) {
    if (rollback) rollback(snap);
    render();
    if (e.message !== 'Unauthorized') {
      toast(errorMsg || e.message || 'Something went wrong', 'error');
    }
    throw e;
  } finally {
    hideSpinner();
    scheduleRefresh();
  }
}

function scheduleRefresh() {
  if (state.refreshTimer) clearTimeout(state.refreshTimer);
  state.refreshTimer = setTimeout(() => refreshCars(), 2000);
}

function startBackgroundRefresh() {
  if (state.refreshInterval) clearInterval(state.refreshInterval);
  state.refreshInterval = setInterval(() => refreshCars(), 60000);
}

async function fetchCars() {
  state.loading = true;
  state.hasError = false;
  render();
  try {
    const res = await apiFetch('/api/cars');
    cars = await res.json();
    state.loading = false;
    state.hasError = false;
    render();
  } catch (e) {
    state.loading = false;
    state.hasError = true;
    render();
    if (e.message !== 'Unauthorized') {
      toast(e.message || 'Failed to load cars', 'error');
    }
  }
}

async function refreshCars() {
  if (Date.now() < state.suppressRefreshUntil) return;
  try {
    const res = await apiFetch('/api/cars');
    const data = await res.json();
    // Only replace if no pending local mutations (tmp- ids present means a create is in-flight)
    if (!cars.some(c => String(c.id).startsWith('tmp-'))) {
      cars = data;
      render();
    }
  } catch { /* silent */ }
}

async function createCar(data) {
  const tmpId = 'tmp-' + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + Math.random());
  const now = new Date().toISOString();
  const optimisticCar = {
    id: tmpId,
    addedAt: now,
    url: data.url || '',
    title: data.title || '',
    make: data.make || '',
    model: data.model || '',
    year: Number(data.year) || 0,
    km: Number(data.km) || 0,
    price: Number(data.price) || 0,
    fuel: data.fuel || '',
    engine: data.engine || '',
    power: Number(data.power) || 0,
    source: data.source || '',
    status: data.status || 'to-contact',
    location: data.location || '',
    contactedAt: data.status === 'contacted' ? now : null,
    notes: data.notes || '',
    priceHistory: [{ date: now, price: Number(data.price) || 0, note: 'Initial price' }],
    _pending: true
  };

  return mutate({
    optimistic: () => { cars.unshift(optimisticCar); return { tmpId }; },
    request: async () => {
      const res = await apiFetch('/api/cars', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const created = await res.json();
      const idx = cars.findIndex(c => c.id === tmpId);
      if (idx !== -1) cars[idx] = created;
      render();
      return created;
    },
    rollback: ({ tmpId }) => {
      const idx = cars.findIndex(c => c.id === tmpId);
      if (idx !== -1) cars.splice(idx, 1);
    },
    successMsg: 'Car added',
    errorMsg: 'Couldn\u2019t add car'
  });
}

async function updateCar(id, data, { silent = false, statusMutation = false } = {}) {
  const idx = cars.findIndex(c => c.id === id);
  if (idx === -1) return;
  const prev = { ...cars[idx] };
  if (statusMutation) state.suppressRefreshUntil = Date.now() + 3000;

  return mutate({
    optimistic: () => {
      const merged = { ...cars[idx] };
      for (const k of ['url','title','make','model','year','km','price','fuel','engine','power','source','status','location','notes']) {
        if (data[k] !== undefined) merged[k] = ['year','km','price','power'].includes(k) ? Number(data[k]) || 0 : data[k];
      }
      if (data.status === 'contacted') merged.contactedAt = new Date().toISOString();
      if (data.status && !['contacted','inactive'].includes(data.status)) merged.contactedAt = null;
      cars[idx] = merged;
      return { prev };
    },
    request: async () => {
      const res = await apiFetch(`/api/cars/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const updated = await res.json();
      const i = cars.findIndex(c => c.id === id);
      if (i !== -1) cars[i] = updated;
      render();
      return updated;
    },
    rollback: ({ prev }) => {
      const i = cars.findIndex(c => c.id === id);
      if (i !== -1) cars[i] = prev;
    },
    successMsg: silent ? null : 'Saved',
    errorMsg: 'Couldn\u2019t save changes'
  });
}

async function deleteCar(id) {
  const ok = await showConfirm({
    title: 'Delete car?',
    message: 'This cannot be undone.',
    confirmLabel: 'Delete',
    danger: true,
  });
  if (!ok) return;
  const idx = cars.findIndex(c => c.id === id);
  if (idx === -1) return;
  const prev = cars[idx];

  return mutate({
    optimistic: () => {
      cars.splice(idx, 1);
      closeDetail();
      return { prev, idx };
    },
    request: async () => {
      await apiFetch(`/api/cars/${id}`, { method: 'DELETE' });
    },
    rollback: ({ prev, idx }) => { cars.splice(idx, 0, prev); },
    successMsg: 'Car deleted',
    errorMsg: 'Couldn\u2019t delete car'
  });
}

// --- Filtering ---
function filterCars(carsArr, searchId, fuelVal, sourceVal, statusVal, makeVal) {
  const search = (document.getElementById(searchId)?.value || '').toLowerCase();
  return carsArr.filter(c => {
    if (search && ![c.title, c.make, c.model, c.notes].some(f => (f || '').toLowerCase().includes(search))) return false;
    if (fuelVal && c.fuel !== fuelVal) return false;
    if (sourceVal && c.source !== sourceVal) return false;
    if (statusVal && c.status !== statusVal) return false;
    if (makeVal && c.make !== makeVal) return false;
    return true;
  });
}

function filterCarsForList(carsArr) {
  const search = (document.getElementById('list-search')?.value || '').toLowerCase();
  const f = listFilters;
  const inRange = (v, min, max) => {
    if (min != null && (v == null || v < min)) return false;
    if (max != null && (v == null || v > max)) return false;
    return true;
  };
  return carsArr.filter(c => {
    if (search && ![c.title, c.make, c.model, c.notes].some(x => (x || '').toLowerCase().includes(search))) return false;
    if (f.fuels.length && !f.fuels.includes(c.fuel)) return false;
    if (f.sources.length && !f.sources.includes(c.source)) return false;
    if (f.makes.length && !f.makes.includes(c.make)) return false;
    if (f.statuses.length) {
      if (!f.statuses.includes(c.status)) return false;
    } else if (c.status === 'rejected') {
      return false;
    }
    if (!inRange(c.year, f.yearMin, f.yearMax)) return false;
    if (!inRange(c.km, f.kmMin, f.kmMax)) return false;
    if (!inRange(c.price, f.priceMin, f.priceMax)) return false;
    if (f.scoreMin != null || f.scoreMax != null) {
      if (!inRange(computeScore(c), f.scoreMin, f.scoreMax)) return false;
    }
    return true;
  });
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// --- Render ---
function render() {
  if (state.loading && !cars.length) {
    renderSkeletons();
    return;
  }
  if (state.hasError && !cars.length) {
    renderError();
    return;
  }
  if (currentView === 'pipeline') renderPipeline();
  else if (currentView === 'list') renderList();
  else if (currentView === 'compare') renderCompare();
  else if (currentView === 'docs') renderDocs();
}

function renderDocs() {
  const el = document.getElementById('docs-view');
  const weights = [
    { label: 'Kms',         pct: 22, hint: 'Fuel-aware sweet spot: diesel 0–130k ⇒ 100, 280k ⇒ 0. Petrol 0–90k ⇒ 100, 200k ⇒ 0.' },
    { label: 'Price',       pct: 22, hint: '€0–€2500 ⇒ 100 (bargain plateau), €5000 ⇒ 0. Doesn\u2019t reward suspiciously cheap listings.' },
    { label: 'Reliability', pct: 30, hint: 'Make baseline (60–90) ± engine adjustment. The dominant subscore — bad engines sink a cheap car.' },
    { label: 'Year',        pct: 13, hint: '2005 ⇒ 0, 2020 ⇒ 100. Rewards newer electronics & DPF maturity.' },
    { label: 'Location',    pct: 13, hint: 'Driving distance from Viana do Castelo, dampened: max 30-point penalty at 600km.' }
  ];

  const weightsHTML = weights.map(w => `
    <div class="docs-weight-card">
      <div class="w-top">
        <span class="w-label">${w.label}</span>
        <span class="w-value">${w.pct}%</span>
      </div>
      <div class="w-hint">${w.hint}</div>
    </div>`).join('');

  const makes = Object.entries(MAKE_RELIABILITY)
    .filter(([k]) => k !== 'vw' && k !== 'citroen')
    .sort((a, b) => b[1] - a[1]);
  const makeCls = v => v >= 75 ? 'green' : v >= 55 ? 'yellow' : 'red';
  const makesHTML = makes.map(([k, v]) => {
    const name = k.split(' ').map(s => s.charAt(0).toUpperCase() + s.slice(1)).join(' ');
    return `<div class="docs-make-row"><span class="m-name">${name}</span><span class="m-score ${makeCls(v)}">${v}</span></div>`;
  }).join('');

  const enginesHTML = ENGINE_PROFILES.map(p => {
    const cls = p.delta > 0 ? 'pos' : 'neg';
    const sign = p.delta > 0 ? '+' : '';
    const pattern = p.re.source
      .replace(/\\s\*/g, ' ')
      .replace(/\\\./g, '.')
      .replace(/\[- ?\]\??/g, '-')
      .replace(/\(\?!.*?\)/g, '')
      .replace(/\\b/g, '')
      .replace(/\(.*?\)/g, m => m.replace(/[()|]/g, ' ').trim().split(/\s+/).slice(0, 2).join('/'))
      .replace(/\s+/g, ' ')
      .trim();
    return `<div class="docs-engine-row ${cls}">
      <span class="docs-engine-label">${esc(pattern)}</span>
      <span class="docs-engine-delta">${sign}${p.delta}</span>
      <span class="docs-engine-reason">${esc(p.reason)}</span>
    </div>`;
  }).join('');

  el.innerHTML = `
    <h2>Scoring Methodology</h2>
    <p class="docs-sub">Every car gets a 0–100 score designed to surface the most promising leads in the ≤5k€ Portuguese used-car segment. Higher is better. The score blends objective facts (km, price, year, distance) with market reliability signals drawn from r/AutoTuga, Motorguia, Razão Automóvel and Furiamotor consensus.</p>

    <div class="docs-section">
      <h3>Weights</h3>
      <div class="docs-weights">${weightsHTML}</div>
    </div>

    <div class="docs-section">
      <h3>How each subscore works</h3>
      <p><strong>Kms.</strong> A fuel-aware sweet-spot curve. Diesels plateau at 100 between <code>0–130 000 km</code> and decay linearly to 0 at <code>280 000 km</code> (practical end of life). Petrol ages faster: plateau <code>0–90 000 km</code>, decay to 0 at <code>200 000 km</code>. Below the plateau the score stays flat — we don't reward suspiciously low km on an old car, since odometer rollback is a common fraud pattern in this segment.</p>
      <p><strong>Price.</strong> Plateau at 100 from <code>€0 to €2500</code>, then linear decay to 0 at the <code>€5000</code> budget ceiling. The plateau exists because suspiciously cheap listings are usually scams, salvage, or mechanical wrecks — not bargains — so we don't award extra points for being cheaper than the realistic-bargain line.</p>
      <p><strong>Reliability.</strong> Each make starts from a baseline (see table below) derived from consistent community consensus. The engine pattern matcher then applies a bonus or penalty based on the known track record of the block. Without an engine signal the score falls back to the pure make baseline. This carries the heaviest weight (30%) because in the ≤5k€ segment, a bad engine can cost more in repairs than the car itself.</p>
      <p><strong>Year.</strong> 2005 → 0, 2020 → 100. Newer cars tend to have better safety kit and more mature DPF/EGR systems, but nothing newer than 2020 usually appears in this budget.</p>
      <p><strong>Location.</strong> Straight-line driving distance from <strong>Viana do Castelo</strong>. Cars in Minho, Porto, Braga score near 100; the curve is dampened so the Algarve max penalty is around 30 points — distance shouldn't bury an otherwise excellent car.</p>
    </div>

    <div class="docs-section">
      <h3>Make reliability baseline</h3>
      <p>Before any engine adjustment. Scale is 0–100.</p>
      <div class="docs-makes">${makesHTML}</div>
    </div>

    <div class="docs-section">
      <h3>Engine adjustments</h3>
      <p>The matcher scans title + notes + the explicit engine field. First match wins, and its delta is added to the make baseline.</p>
      <div class="docs-engines">${enginesHTML}</div>
    </div>

    <div class="docs-section">
      <h3>Why these adjustments?</h3>
      <ul>
        <li><strong>Fiat 1.3 Multijet / Opel 1.3 CDTi / Alfa 1.3 JTDM</strong> — same Fiat block. Timing chain stretch at 120–150k km (expensive fix), EGR/DPF clogging, turbo failures, injector issues. Widely labelled a "motor a evitar". Strongest negative flag in the model.</li>
        <li><strong>VW 1.2/1.4 TSI (EA111) and 1.6 TDI CR (EA189)</strong> — timing chain and injector problems respectively. The post-2013 EA211 TSIs corrected most of this and get a small bonus instead.</li>
        <li><strong>PSA 1.4 HDi / Ford 1.4 TDCi</strong> — shared block, small displacement working hard in Fiestas/C3s/207s. Injector and FAP issues are near-universal beyond 150k km.</li>
        <li><strong>Renault 1.5 dCi (K9K)</strong> — small penalty. The engine can do 300k km if lucky, but K9K-722 onwards had serious injector/turbo runs. The 2013+ Energy dCi variant is cleaner; the field value is conservative.</li>
        <li><strong>Toyota 1.4 D-4D / VVT-i</strong> — the reference point of durability. 300k km+ units with just belts and oil are documented. Strong positive bonus.</li>
        <li><strong>VAG 1.9 TDI (PD and non-PD)</strong> — the legendary EDC-based diesel. Simple, abundant parts, fixable. Positive bonus.</li>
      </ul>
    </div>

    <div class="docs-section">
      <h3>What isn't scored</h3>
      <ul>
        <li><strong>Seller behaviour</strong> — note it in the Notes field; not a numeric input.</li>
        <li><strong>Accident history / rust</strong> — impossible to assess remotely. Inspect on visit.</li>
        <li><strong>Options/trim level</strong> — irrelevant for this budget; most listings are base/mid trim.</li>
        <li><strong>FAP/DPF removal</strong> — technically adds torque and reduces failure risk, but it's illegal for IPO. The model ignores it.</li>
      </ul>
    </div>

    <div class="docs-section">
      <h3>Colour thresholds</h3>
      <p><code>≥ 75</code> green · <code>50–74</code> yellow · <code>&lt; 50</code> red. Don't overthink a single-point gap — the model is a ranking aid, not an oracle.</p>
    </div>

    <div class="docs-section">
      <h3>Sources &amp; further reading</h3>
      <div class="docs-sources">
        Reliability consensus is distilled from Portuguese used-car community discussions (r/AutoTuga threads on "carro até 5000 €"), plus editorial reviews from <a href="https://www.razaoautomovel.com/" target="_blank">Razão Automóvel</a>, <a href="https://motorguia.net/" target="_blank">Motorguia</a>, <a href="https://furiamotor.com/" target="_blank">Furiamotor</a>, and the <a href="https://www.e-konomista.pt/motores-diesel-fiaveis/" target="_blank">E-konomista</a> diesel-reliability roundup. Engine-specific verdicts are cross-checked against owner forums (ibizaClubPT, alfaromeoteam, clubegolfpt).
      </div>
    </div>
  `;
}

function renderPipeline() {
  const fuel = document.getElementById('pipeline-fuel-filter').value;
  const source = document.getElementById('pipeline-source-filter').value;
  const filtered = filterCars(cars, 'pipeline-search', fuel, source);

  const el = document.getElementById('pipeline-view');
  el.innerHTML = STATUSES.map(s => {
    const colCars = filtered.filter(c => c.status === s.key);
    return `<div class="pipeline-col" data-status="${s.key}"
        ondragover="event.preventDefault();this.classList.add('drag-over')"
        ondragleave="if(!this.contains(event.relatedTarget)){this.classList.remove('drag-over')}"
        ondrop="event.preventDefault();this.classList.remove('drag-over');handleDrop(event,this)">
      <div class="pipeline-col-header">${s.label} <span class="count-badge">${colCars.length}</span></div>

    </div>`;
  }).join('');
}
function handleDrop(event, col) {
  const id = event.dataTransfer.getData('carId');
  const newStatus = col.dataset.status;
  if (!id || !newStatus) return;
  const car = cars.find(c => c.id === id);
  if (!car || car.status === newStatus) return;
  updateCar(id, { status: newStatus }, { silent: true, statusMutation: true });
}

function listHeaderCell(label, sortField, filterCol) {
  const sortArrow = sortField && listSort.field === sortField ? (listSort.asc ? ' \u2191' : ' \u2193') : '';

    ? `<span class="th-label sort-btn${sortActive}" data-sort="${sortField}">${label}${sortArrow}</span>`
    : `<span class="th-label">${label}</span>`;
  const filterActive = filterCol && listFilterIsActive(filterCol) ? ' active' : '';

    ? `<button type="button" class="th-filter${filterActive}" data-filter-col="${filterCol}" aria-label="Filter ${label}"><svg viewBox="0 0 10 10" fill="currentColor"><path d="M1 2h8L6 6v3L4 8V6L1 2z"/></svg></button>`

  const total = cars.filter(c => c.status !== 'rejected' || listFilters.statuses.includes('rejected')).length;
  if (countEl) {
    countEl.textContent = filteredCount === total
      ? `${filteredCount} ${filteredCount === 1 ? 'car' : 'cars'}`
      : `${filteredCount} of ${total}`;
  }
  const activeCount = listActiveFilterCount();
  const pill = document.getElementById('list-filters-active-count');
  if (pill) {
    pill.textContent = String(activeCount);
    pill.hidden = activeCount === 0;

function renderList() {
  let filtered = filterCarsForList(cars);
