  filtered.sort((a, b) => {
    let av, bv;
    if (listSort.field === 'score') { av = computeScore(a); bv = computeScore(b); }
    else if (listSort.field === 'addedAt') { av = a.addedAt; bv = b.addedAt; }
    else { av = a[listSort.field]; bv = b[listSort.field]; }
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (av < bv) return listSort.asc ? -1 : 1;
    if (av > bv) return listSort.asc ? 1 : -1;
    return 0;

function setCompareFilter(v) {
  compareFilter = v || '';
  renderCompare();
}

function renderCompare() {
  const selEl = document.getElementById('compare-selectors');
  const clearBtn = document.getElementById('compare-clear-btn');
  const filterInput = document.getElementById('compare-filter');
  if (filterInput && filterInput.value !== compareFilter) filterInput.value = compareFilter;

  const comparableCars = cars
    .filter(c => c.status !== 'rejected')
    .map(c => ({ car: c, score: computeScore(c) }))
    .sort((a, b) => b.score - a.score);

  const needle = compareFilter.trim().toLowerCase();
  const visible = needle
    ? comparableCars.filter(({ car }) => {
        const hay = [car.title, car.make, car.model].filter(Boolean).join(' ').toLowerCase();
        return hay.includes(needle);
      })
    : comparableCars;

  const atLimit = selectedForCompare.size >= 5;
  selEl.innerHTML = visible.map(({ car: c }) => {
    const isSelected = selectedForCompare.has(c.id);
    const active = isSelected ? ' active' : '';
    const disabled = !isSelected && atLimit ? ' disabled' : '';
    return `<button class="compare-toggle${active}${disabled}" onclick="toggleCompare('${c.id}')" title="${atLimit && !isSelected ? 'Max 5 cars to compare' : ''}">${esc(c.title)}</button>`;
  }).join('') || '<div class="compare-no-matches">No cars match your filter.</div>';
  if (clearBtn) clearBtn.style.display = selectedForCompare.size > 0 ? '' : 'none';

  const wrap = document.getElementById('compare-table-wrap');
  const selected = cars.filter(c => selectedForCompare.has(c.id));
  if (selected.length < 2) {
    wrap.innerHTML = '<div class="empty-state"><div class="empty-state-icon">\u2194</div>Select at least 2 cars to compare</div>';
    return;
  }

  const fields = [
    { key: 'source', label: 'Source' },
    {
      key: 'year', label: 'Year', numeric: true, higherBetter: true,
      getValue: c => c.year || null,
      format: (v, car) => {
        if (!v) return '\u2014';
        const age = new Date().getFullYear() - v;
        return `${v} <span class="compare-meta">\u00B7 ${age} yrs</span>`;
      },
      getCarForFormat: true
    },
    { key: 'km', label: 'Km', numeric: true, higherBetter: false, format: v => v ? v.toLocaleString() : '\u2014' },
    {
      key: 'price', label: 'Price', numeric: true, higherBetter: false,
      format: (v, car) => {
        if (!v) return '\u2014';
        const drops = (car.priceHistory || []).length - 1;
        const badge = drops > 0 ? `<span class="price-drop-badge">\u2193${drops}</span>` : '';
        return '\u20AC' + v.toLocaleString() + badge;
      },
      getValue: c => c.price,
      getCarForFormat: true
    },
    {
      key: 'eurPerKm', label: '\u20AC/km driven', numeric: true, higherBetter: false,
      getValue: c => (c.price && c.km) ? c.price / c.km : null,
      format: v => v == null ? '\u2014' : '\u20AC' + v.toFixed(3)
    },
    { key: 'fuel', label: 'Fuel' },
    {
      key: 'engine', label: 'Engine',
      format: (v, car) => {
        const parts = [v, car.power ? car.power + 'cv' : ''].filter(Boolean);
        return parts.length ? esc(parts.join(' \u00B7 ')) : '\u2014';
      },
      getCarForFormat: true
    },
    {
      key: 'location', label: 'Location', numeric: true, higherBetter: false,
      getValue: c => locationKm(c.location),
      format: (v, car) => {
        const place = car.location ? esc(car.location) : '';
        const dist = v == null ? '' : `<span class="compare-meta">\u00B7 ${v} km</span>`;
        if (!place && v == null) return '\u2014';
        return place ? `${place} ${dist}` : dist;
      },
      getCarForFormat: true
    },
    {
      key: 'score', label: 'Score', numeric: true, higherBetter: true,
      getValue: c => computeScore(c),
      format: v => {
        const sc = scoreClass(v);
        return `<span class="compare-score-chip ${sc}">${v}</span>`;
      },
      isScoreRow: true
    },
    { key: 'notes', label: 'Notes', format: v => v || '\u2014' }
  ];

  const subscoreLabels = [
    { key: 'km', label: 'Kms' },
    { key: 'price', label: 'Price' },
    { key: 'rel', label: 'Reliability', extract: b => b.rel.score },
    { key: 'year', label: 'Year' },
    { key: 'loc', label: 'Location' }
  ];

  // Winner = highest score; tiebreak by lower price, then lower km
  const withScores = selected.map(c => ({ c, score: computeScore(c) }));
  const topScore = Math.max(...withScores.map(x => x.score));
  const tied = withScores.filter(x => x.score === topScore);
  tied.sort((a, b) => (a.c.price || Infinity) - (b.c.price || Infinity) || (a.c.km || Infinity) - (b.c.km || Infinity));
  const winnerId = tied.length && withScores.length > 1 ? tied[0].c.id : null;

  // Mobile-only chip strip (hidden on desktop via CSS) — keeps remove + winner reachable
  let html = '<div class="compare-chip-strip">';
  selected.forEach(c => {
    const isWinner = c.id === winnerId;
    const pill = isWinner ? '<span class="compare-winner-pill">\u2605 Best</span>' : '';
    html += `<div class="compare-chip${isWinner ? ' winner' : ''}">
      <span class="compare-chip-title" onclick="openDetail('${c.id}')">${esc(c.title)}</span>${pill}
      <button class="compare-remove-btn" onclick="event.stopPropagation();toggleCompare('${c.id}')" title="Remove" aria-label="Remove">\u00D7</button>
    </div>`;
  });
  html += '</div>';
  html += '<table class="compare-table"><thead><tr><th></th>';
  selected.forEach(c => {
    const isWinner = c.id === winnerId;
    const pill = isWinner ? '<span class="compare-winner-pill">\u2605 Best</span>' : '';
    html += `<th class="${isWinner ? 'winner' : ''}">
      <div class="compare-th-inner" onclick="openDetail('${c.id}')" title="Open detail">
        <span class="compare-th-title">${esc(c.title)}</span>${pill}
      </div>
      <button class="compare-remove-btn" onclick="event.stopPropagation();toggleCompare('${c.id}')" title="Remove from comparison" aria-label="Remove">\u00D7</button>
    </th>`;
  });
  html += '</tr></thead><tbody>';

  const highlight = (vals, higherBetter) => {
    const nums = vals.filter(v => typeof v === 'number' && isFinite(v));
    if (nums.length < 2) return { best: null, worst: null };
    const best = higherBetter ? Math.max(...nums) : Math.min(...nums);
    const worst = higherBetter ? Math.min(...nums) : Math.max(...nums);
    return best === worst ? { best: null, worst: null } : { best, worst };
  };

  fields.forEach(f => {
    const values = selected.map(c => f.getValue ? f.getValue(c) : c[f.key]);
    const { best, worst } = f.numeric ? highlight(values, f.higherBetter) : { best: null, worst: null };
    html += `<tr><th>${f.label}</th>`;
    values.forEach((v, i) => {
      const car = selected[i];
      let cls = '';
      if (f.numeric && v === best && best !== null) cls = ' class="best"';
      else if (f.numeric && v === worst && worst !== null) cls = ' class="worst"';
      const display = f.format ? (f.getCarForFormat ? f.format(v, car) : f.format(v)) : (v || '\u2014');
      html += `<td${cls} data-car="${esc(car.title)}">${display}</td>`;
    });
    html += '</tr>';

    if (f.isScoreRow) {
      const breakdowns = selected.map(c => computeScoreBreakdown(c));
      subscoreLabels.forEach(sl => {
        html += `<tr class="compare-subscore-row"><th>${sl.label}</th>`;
        const subVals = breakdowns.map(b => sl.extract ? sl.extract(b) : b[sl.key]);
        const subMax = Math.max(...subVals);
        const subMin = Math.min(...subVals);
        subVals.forEach((val, i) => {
          const car = selected[i];
          const barClass = val >= 75 ? 'green' : val >= 50 ? 'yellow' : 'red';
          let tdCls = '';
          if (subMax !== subMin) {
            if (val === subMax) tdCls = ' class="best"';
            else if (val === subMin) tdCls = ' class="worst"';
          }
          html += `<td${tdCls} data-car="${esc(car.title)}"><div class="compare-mini-bar"><div class="compare-mini-bar-fill ${barClass}" style="width:${val}%"></div></div></td>`;
        });
        html += '</tr>';
      });
    }
  });

  html += '</tbody></table>';
  wrap.innerHTML = html;
}

// --- Detail Panel ---
function scoreBreakdownHTML(car) {
  const b = computeScoreBreakdown(car);
  const row = (label, val, weight) => {
    const cls = val >= 75 ? '' : val >= 50 ? 'mid' : 'low';
    return `<div class="score-breakdown-row">
      <span class="score-breakdown-label">${label}</span>
      <span class="score-breakdown-bar"><span class="score-breakdown-bar-fill ${cls}" style="width:${val}%"></span></span>
      <span class="score-breakdown-weight">${Math.round(weight * 100)}%</span>
      <span class="score-breakdown-value">${val}</span>
    </div>`;
  };
  let html = '<div class="score-breakdown">';
  html += row('Kms', b.km, SCORE_WEIGHTS.km);
  html += row('Price', b.price, SCORE_WEIGHTS.price);
  html += row('Reliability', b.rel.score, SCORE_WEIGHTS.reliability);
  if (b.rel.reason) {
    const cls = b.rel.delta > 0 ? 'pos' : 'neg';
    const sign = b.rel.delta > 0 ? '+' : '';
    html += `<div class="score-breakdown-reason ${cls}">${sign}${b.rel.delta} · ${esc(b.rel.reason)}</div>`;
  }
  html += row('Year', b.year, SCORE_WEIGHTS.year);
  html += row('Location', b.loc, SCORE_WEIGHTS.location);
  html += '</div>';
  return html;
}

// --- Custom dialog (confirm / prompt) ---
const DialogUI = (() => {
  const overlay = document.getElementById('dialog-overlay');
  const titleEl = document.getElementById('dialog-title');
  const msgEl = document.getElementById('dialog-message');
  const inputGroup = document.getElementById('dialog-input-group');
  const inputEl = document.getElementById('dialog-input');
  const cancelBtn = document.getElementById('dialog-cancel');
  const confirmBtn = document.getElementById('dialog-confirm');
  let pendingResolve = null;
  let mode = 'confirm';

  function cancelValue() { return mode === 'prompt' ? null : false; }
  function confirmValue() { return mode === 'prompt' ? inputEl.value : true; }

  function close(result) {
    overlay.classList.remove('open');
    document.removeEventListener('keydown', onKey, true);
    const fn = pendingResolve;
    pendingResolve = null;
    if (fn) fn(result);
  }

  function onKey(e) {
    if (e.key === 'Escape') { e.preventDefault(); close(cancelValue()); }
    else if (e.key === 'Enter') {
      if (e.target.tagName === 'TEXTAREA') return;
      e.preventDefault();
      close(confirmValue());
    }
  }

  cancelBtn.addEventListener('click', () => close(cancelValue()));
  confirmBtn.addEventListener('click', () => close(confirmValue()));
  overlay.addEventListener('mousedown', e => { if (e.target === overlay) close(cancelValue()); });

  function open(opts, kind) {
    if (pendingResolve) { const fn = pendingResolve; pendingResolve = null; fn(cancelValue()); }
    mode = kind;
    titleEl.textContent = opts.title || (kind === 'prompt' ? 'Input required' : 'Confirm');
    const message = opts.message || '';
    msgEl.textContent = message;
    msgEl.hidden = !message;
    confirmBtn.textContent = opts.confirmLabel || (kind === 'prompt' ? 'OK' : 'Confirm');
    cancelBtn.textContent = opts.cancelLabel || 'Cancel';
    confirmBtn.classList.toggle('btn-danger', !!opts.danger);
    confirmBtn.classList.toggle('btn-primary', !opts.danger);
    if (kind === 'prompt') {
      inputGroup.hidden = false;
      inputEl.type = opts.type || 'text';
      inputEl.placeholder = opts.placeholder || '';
      inputEl.value = opts.defaultValue || '';
    } else {
      inputGroup.hidden = true;
    }
    overlay.classList.add('open');
    document.addEventListener('keydown', onKey, true);
    setTimeout(() => {
      if (kind === 'prompt') { inputEl.focus(); inputEl.select(); }
      else { confirmBtn.focus(); }
    }, 30);
    return new Promise(resolve => { pendingResolve = resolve; });
  }

  return {
    confirm: (opts = {}) => open(opts, 'confirm'),
    prompt: (opts = {}) => open(opts, 'prompt'),
  };
})();

function showConfirm(opts) { return DialogUI.confirm(opts); }
function showPrompt(opts) { return DialogUI.prompt(opts); }

async function handleSubmit(e) {
  e.preventDefault();
  const data = {
    url: document.getElementById('form-url').value,
    title: document.getElementById('form-title').value,
    make: document.getElementById('form-make').value,
    model: document.getElementById('form-model').value,
    year: document.getElementById('form-year').value,
    km: document.getElementById('form-km').value,
    price: document.getElementById('form-price').value,
    fuel: document.getElementById('form-fuel').value,
    engine: document.getElementById('form-engine').value,
    power: document.getElementById('form-power').value,
    source: document.getElementById('form-source').value,
    status: document.getElementById('form-status').value,
    location: document.getElementById('form-location').value,
    notes: document.getElementById('form-notes').value
  };

  const submitBtn = document.getElementById('form-submit-btn');
  submitBtn.classList.add('btn-loading');
  submitBtn.disabled = true;

  try {
    const id = document.getElementById('form-id').value;
    if (id) {
      const priceNote = document.getElementById('form-price-note').value;
      if (priceNote) data.priceNote = priceNote;
      await updateCar(id, data);
    } else {
      await createCar(data);
    }
    closeModal();
  } catch {
    /* error toast already shown by mutate(); keep modal open */
  } finally {
    submitBtn.classList.remove('btn-loading');
    submitBtn.disabled = false;
  }
}

// --- Column filter popover ---
let _popoverCol = null;
function openColumnPopover(col, anchorEl) {
  const meta = LIST_COL_META[col]; if (!meta) return;
  const pop = document.getElementById('th-popover');
  if (_popoverCol === col && pop.classList.contains('open')) { closeColumnPopover(); return; }
  _popoverCol = col;
  pop.innerHTML = buildPopoverHTML(col, meta);
  pop.classList.add('open');
  // Position: anchor below the icon, clamped to viewport
  const r = anchorEl.getBoundingClientRect();
  const popW = Math.min(280, window.innerWidth - 16);
  let left = Math.min(window.innerWidth - popW - 8, Math.max(8, r.left));
  let top = r.bottom + 6;
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  pop.style.width = popW + 'px';
  wirePopoverInputs(col, meta);
}
function closeColumnPopover() {
  const pop = document.getElementById('th-popover');
  pop.classList.remove('open');
  _popoverCol = null;
}
function buildPopoverHTML(col, meta) {
  if (meta.type === 'categorical') {
    const selected = listFilters[meta.key] || [];
    const options = categoricalOptions(col);
    return `<div class="pop-title">Filter by ${meta.title}</div>
      <div class="pop-options">
        ${options.map(o => `
          <label class="pop-option">
            <input type="checkbox" data-value="${esc(o.value)}" ${selected.includes(o.value) ? 'checked' : ''}>
            <span class="pop-opt-label">${o.display}</span>
          </label>`).join('')}
      </div>
      <div class="pop-actions">
        <button type="button" class="pop-clear">Clear</button>
        <button type="button" class="pop-close">Done</button>
      </div>`;
  }
  // range
  const min = listFilters[meta.minKey], max = listFilters[meta.maxKey];
  return `<div class="pop-title">${meta.title} range</div>
    <div class="pop-range-labels"><span>Min</span><span>Max</span></div>
    <div class="pop-range">
      <input type="number" class="pop-min" placeholder="${meta.placeholder[0]}" value="${min == null ? '' : min}">
      <input type="number" class="pop-max" placeholder="${meta.placeholder[1]}" value="${max == null ? '' : max}">
    </div>
    <div class="pop-actions">
      <button type="button" class="pop-clear">Clear</button>
      <button type="button" class="pop-close">Done</button>
    </div>`;
}
function categoricalOptions(col) {
  if (col === 'source') {
    const fixed = ['StandVirtual', 'AutoScout24', 'OLX', 'Facebook Marketplace', 'PiscaPisca', 'CustoJusto', 'Other'];
    const extra = [...new Set(cars.map(c => c.source).filter(Boolean))].filter(s => !fixed.includes(s));
    return [...fixed, ...extra].map(v => ({ value: v, display: esc(v) }));
  }
  if (col === 'make') {
    const makes = [...new Set(cars.map(c => c.make).filter(Boolean))].sort();
    return makes.map(v => ({ value: v, display: esc(v) }));
  }
  if (col === 'status') {
    return STATUSES.map(s => ({
      value: s.key,
      display: `<span class="status-badge ${s.key}" style="padding:2px 10px;">${s.label}</span>`
    }));
  }
  if (col === 'fuel') {
    return ['Diesel', 'Gasolina'].map(v => ({ value: v, display: esc(v) }));
  }
  return [];
}
function wirePopoverInputs(col, meta) {
  const pop = document.getElementById('th-popover');
  if (meta.type === 'categorical') {
    pop.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', () => {
        const v = cb.dataset.value;
        const arr = listFilters[meta.key];
        const idx = arr.indexOf(v);
        if (cb.checked && idx === -1) arr.push(v);
        else if (!cb.checked && idx !== -1) arr.splice(idx, 1);
        renderList();
      });
    });
  } else {
    const minInput = pop.querySelector('.pop-min');
    const maxInput = pop.querySelector('.pop-max');
    const update = () => {
      const minVal = minInput.value.trim();
      const maxVal = maxInput.value.trim();
      listFilters[meta.minKey] = minVal === '' ? null : Number(minVal);
      listFilters[meta.maxKey] = maxVal === '' ? null : Number(maxVal);
      renderList();
    };
    minInput.addEventListener('input', update);
    maxInput.addEventListener('input', update);
  }
  pop.querySelector('.pop-clear').addEventListener('click', () => {
    if (meta.type === 'categorical') listFilters[meta.key] = [];
    else { listFilters[meta.minKey] = null; listFilters[meta.maxKey] = null; }
    renderList();
    // refresh the popover contents
    pop.innerHTML = buildPopoverHTML(col, meta);
    wirePopoverInputs(col, meta);
  });
  pop.querySelector('.pop-close').addEventListener('click', () => closeColumnPopover());
}
// Close popover on outside click / Escape / resize / scroll
document.addEventListener('mousedown', e => {
  const pop = document.getElementById('th-popover');
  if (!pop.classList.contains('open')) return;
  if (pop.contains(e.target)) return;
  if (e.target.closest('.th-filter')) return;
  closeColumnPopover();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('th-popover').classList.contains('open')) closeColumnPopover();
});
window.addEventListener('scroll', e => {
  const pop = document.getElementById('th-popover');
  if (e.target instanceof Node && pop.contains(e.target)) return;
  closeColumnPopover();
}, true);
window.addEventListener('resize', () => closeColumnPopover());

// --- Mobile filters sheet ---
function openMobileFiltersSheet() {
  const overlay = ensureMobileSheet();
  overlay.classList.add('open');
  renderMobileSheetBody();
}
function closeMobileFiltersSheet() {
  const overlay = document.getElementById('mobile-filter-sheet');
  if (overlay) overlay.classList.remove('open');
}
function ensureMobileSheet() {
  let overlay = document.getElementById('mobile-filter-sheet');
  if (overlay) return overlay;
  overlay = document.createElement('div');
  overlay.id = 'mobile-filter-sheet';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal" onclick="event.stopPropagation()" style="width:460px;">
    <h2>Filters</h2>
    <div id="mobile-filter-body"></div>
    <div style="display:flex;gap:8px;justify-content:space-between;margin-top:16px;">
      <button type="button" class="btn btn-secondary" id="mobile-filter-clear">Clear all</button>
      <button type="button" class="btn btn-primary" id="mobile-filter-done">Done</button>
    </div>
  </div>`;
  overlay.addEventListener('click', e => { if (e.target === overlay) closeMobileFiltersSheet(); });
  document.body.appendChild(overlay);
  overlay.querySelector('#mobile-filter-clear').addEventListener('click', () => {
    resetListFilters();
    renderList();
    renderMobileSheetBody();
  });
  overlay.querySelector('#mobile-filter-done').addEventListener('click', () => closeMobileFiltersSheet());
  return overlay;
}
function renderMobileSheetBody() {
  const body = document.getElementById('mobile-filter-body');
  if (!body) return;
  const sections = ['source', 'make', 'status', 'fuel', 'year', 'km', 'price', 'score'];
  body.innerHTML = sections.map(col => {
    const meta = LIST_COL_META[col];
    if (meta.type === 'categorical') {
      const selected = listFilters[meta.key] || [];
      const options = categoricalOptions(col);
      return `<div class="mf-section">
        <div class="mf-title">${meta.title}</div>
        <div class="mf-options">${options.map(o => `
          <label class="pop-option">
            <input type="checkbox" data-col="${col}" data-value="${esc(o.value)}" ${selected.includes(o.value) ? 'checked' : ''}>
            <span class="pop-opt-label">${o.display}</span>
          </label>`).join('')}</div>
      </div>`;
    }
    const min = listFilters[meta.minKey], max = listFilters[meta.maxKey];
    return `<div class="mf-section">
      <div class="mf-title">${meta.title}</div>
      <div class="pop-range">
        <input type="number" data-col="${col}" data-bound="min" placeholder="${meta.placeholder[0]}" value="${min == null ? '' : min}">
        <input type="number" data-col="${col}" data-bound="max" placeholder="${meta.placeholder[1]}" value="${max == null ? '' : max}">
      </div>
    </div>`;
  }).join('');

  body.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', () => {
      const meta = LIST_COL_META[cb.dataset.col];
      const v = cb.dataset.value;
      const arr = listFilters[meta.key];
      const idx = arr.indexOf(v);
      if (cb.checked && idx === -1) arr.push(v);
      else if (!cb.checked && idx !== -1) arr.splice(idx, 1);
      renderList();
    });
  });
  body.querySelectorAll('input[type="number"]').forEach(inp => {
    inp.addEventListener('input', () => {
      const meta = LIST_COL_META[inp.dataset.col];
      const key = inp.dataset.bound === 'min' ? meta.minKey : meta.maxKey;
      listFilters[key] = inp.value.trim() === '' ? null : Number(inp.value);
      renderList();
    });
  });
}

// --- Custom Selects ---
function initCustomSelects() {
  const nativeValueDesc = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');

  document.querySelectorAll('select').forEach(sel => {
    const wrap = document.createElement('div');
    wrap.className = 'custom-select-wrap';
    sel.parentNode.insertBefore(wrap, sel);
    sel.style.display = 'none';
    wrap.appendChild(sel);

    const trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'custom-select-trigger';
    trigger.setAttribute('aria-haspopup', 'listbox');
    trigger.setAttribute('aria-expanded', 'false');

    const triggerText = document.createElement('span');
    triggerText.className = 'custom-select-trigger-text';

    const arrow = document.createElement('span');
    arrow.className = 'custom-select-arrow';
    arrow.innerHTML = '<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    trigger.appendChild(triggerText);
    trigger.appendChild(arrow);

    const dropdown = document.createElement('div');
    dropdown.className = 'custom-select-dropdown';
    dropdown.setAttribute('role', 'listbox');

    wrap.appendChild(trigger);
    wrap.appendChild(dropdown);

    function buildDropdown() {
      dropdown.innerHTML = '';
      Array.from(sel.options).forEach(opt => {
        const div = document.createElement('div');
        div.className = 'custom-select-option' + (opt.value === '' ? ' is-placeholder' : '');
        div.setAttribute('role', 'option');
        div.textContent = opt.textContent;
        div.dataset.value = opt.value;
        div.addEventListener('mousedown', e => {
          e.preventDefault();
          nativeValueDesc.set.call(sel, opt.value);
          syncTrigger();
          closeDropdown();
          sel.dispatchEvent(new Event('change', { bubbles: true }));
          sel.dispatchEvent(new Event('input', { bubbles: true }));
        });
        dropdown.appendChild(div);
      });
    }

    function syncTrigger() {
      const val = nativeValueDesc.get.call(sel);
      const opt = sel.options[sel.selectedIndex];
      const label = opt ? opt.textContent : '';
      const isPlaceholder = !val;
      triggerText.textContent = label;
      triggerText.className = 'custom-select-trigger-text' + (isPlaceholder ? ' is-placeholder' : '');
      dropdown.querySelectorAll('.custom-select-option').forEach(d => {
        d.classList.toggle('selected', d.dataset.value === val);
      });
    }

    function openDropdown() {
      // Close any other open dropdowns first
      document.querySelectorAll('.custom-select-wrap.open').forEach(w => {
        if (w !== wrap) w.classList.remove('open');
      });
      wrap.classList.add('open');
      trigger.classList.add('open');
      trigger.setAttribute('aria-expanded', 'true');
    }

    function closeDropdown() {
      wrap.classList.remove('open');
      trigger.classList.remove('open');
      trigger.setAttribute('aria-expanded', 'false');
    }

    trigger.addEventListener('click', () => {
      wrap.classList.contains('open') ? closeDropdown() : openDropdown();
    });

    trigger.addEventListener('blur', () => {
      setTimeout(closeDropdown, 120);
    });

    // Keyboard support
    trigger.addEventListener('keydown', e => {
      const opts = Array.from(dropdown.querySelectorAll('.custom-select-option'));
      const currentIdx = opts.findIndex(d => d.dataset.value === nativeValueDesc.get.call(sel));
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        wrap.classList.contains('open') ? closeDropdown() : openDropdown();
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        const next = opts[Math.min(currentIdx + 1, opts.length - 1)];
        if (next) { nativeValueDesc.set.call(sel, next.dataset.value); syncTrigger(); sel.dispatchEvent(new Event('change', { bubbles: true })); sel.dispatchEvent(new Event('input', { bubbles: true })); }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        const prev = opts[Math.max(currentIdx - 1, 0)];
        if (prev) { nativeValueDesc.set.call(sel, prev.dataset.value); syncTrigger(); sel.dispatchEvent(new Event('change', { bubbles: true })); sel.dispatchEvent(new Event('input', { bubbles: true })); }
      } else if (e.key === 'Escape') {
        closeDropdown();
      }
    });

    // Override value setter so programmatic assignments sync the UI
    sel._syncCustomSelect = syncTrigger;
    Object.defineProperty(sel, 'value', {
      get() { return nativeValueDesc.get.call(this); },
      set(v) { nativeValueDesc.set.call(this, v); syncTrigger(); },
      configurable: true
    });

    buildDropdown();
    syncTrigger();
  });

  // Handle form.reset() — native reset bypasses the value setter, so sync manually
  document.getElementById('car-form').addEventListener('reset', () => {
    setTimeout(() => {
      document.querySelectorAll('#car-form select').forEach(sel => {
        if (sel._syncCustomSelect) sel._syncCustomSelect();
      });
    }, 0);
  });

  // Close all on outside click
  document.addEventListener('click', e => {
    if (!e.target.closest('.custom-select-wrap')) {
      document.querySelectorAll('.custom-select-wrap.open').forEach(w => w.classList.remove('open'));
    }
  });
}

initCustomSelects();

// --- Custom Comboboxes (text input + filtered suggestion dropdown) ---
function initCustomComboboxes() {
  const FIELDS = [
    { inputId: 'form-make',   datalistId: 'makes-list' },
    { inputId: 'form-model',  datalistId: 'models-list' },
    { inputId: 'form-engine', datalistId: 'engines-list' },
  ];

  FIELDS.forEach(({ inputId, datalistId }) => {
    const input = document.getElementById(inputId);
    const datalist = document.getElementById(datalistId);
    if (!input || !datalist) return;

    input.removeAttribute('list');

    const wrap = document.createElement('div');
    wrap.className = 'custom-combobox-wrap';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);

    const dropdown = document.createElement('div');
    dropdown.className = 'custom-select-dropdown custom-combobox-dropdown';
    dropdown.setAttribute('role', 'listbox');
    wrap.appendChild(dropdown);

    let kbdIdx = -1;

    function getMatches(query) {
      const opts = Array.from(datalist.options).map(o => o.value);
      if (!opts.length) return [];
      const q = query.trim().toLowerCase();
      if (!q) return opts;
      return opts.filter(v => v.toLowerCase().includes(q));
    }

    function renderDropdown() {
      const matches = getMatches(input.value);
      if (!matches.length) { closeDropdown(); return; }
      dropdown.innerHTML = '';
      kbdIdx = -1;
      matches.forEach(val => {
        const div = document.createElement('div');
        div.className = 'custom-select-option';
        div.setAttribute('role', 'option');
        div.textContent = val;
        div.addEventListener('mousedown', e => {
          e.preventDefault();
          input.value = val;
          input.dispatchEvent(new Event('input', { bubbles: true }));
          input.dispatchEvent(new Event('change', { bubbles: true }));
          closeDropdown();
        });
        dropdown.appendChild(div);
      });
      wrap.classList.add('open');
    }

    function closeDropdown() {
      wrap.classList.remove('open');
      dropdown.innerHTML = '';
      kbdIdx = -1;
    }

    function setKbd(idx) {
      const opts = dropdown.querySelectorAll('.custom-select-option');
      opts.forEach((o, i) => o.classList.toggle('kbd-active', i === idx));
      kbdIdx = idx;
    }

    input.addEventListener('focus', renderDropdown);
    input.addEventListener('input', renderDropdown);
    input.addEventListener('blur', () => setTimeout(closeDropdown, 120));
    input.addEventListener('keydown', e => {
      const opts = Array.from(dropdown.querySelectorAll('.custom-select-option'));
      if (e.key === 'ArrowDown') {
        e.preventDefault(); setKbd(Math.min(kbdIdx + 1, opts.length - 1));
      } else if (e.key === 'ArrowUp') {
        e.preventDefault(); setKbd(Math.max(kbdIdx - 1, 0));
      } else if (e.key === 'Enter' && kbdIdx >= 0) {
        e.preventDefault();
        const opt = opts[kbdIdx];
        if (opt) { input.value = opt.textContent; input.dispatchEvent(new Event('input', { bubbles: true })); closeDropdown(); }
      } else if (e.key === 'Escape') {
        closeDropdown();
      }
    });
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.custom-combobox-wrap')) {
      document.querySelectorAll('.custom-combobox-wrap.open').forEach(w => w.classList.remove('open'));
    }
  });
}

initCustomComboboxes();

fetchCars().then(() => startBackgroundRefresh());
